<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bazro POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #111827;
      color: #fff;
    }

    .store-title {
      font-weight: 600;
    }

    .header-actions button {
      margin-left: 0.5rem;
    }

    .app-main {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
    }

    .bottom-nav {
      display: flex;
      border-bottom: 1px solid #ddd;
      background: #fff;
    }

    .nav-btn {
      flex: 1;
      padding: 0.5rem;
      border: none;
      background: transparent;
      font-size: 0.9rem;
    }

    .nav-btn.active {
      border-bottom: 3px solid #2563eb;
      font-weight: 600;
    }

    .view {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: none;
    }

    .view.active {
      display: block;
    }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .search-bar input {
      flex: 1;
    }

    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .category-filters button {
      padding: 0.25rem 0.5rem;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 0.75rem;
    }

    .category-filters button.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }

    .product-card {
      background: #fff;
      border-radius: 0.5rem;
      padding: 0.4rem;
      text-align: center;
      font-size: 0.8rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .product-card-emoji {
      font-size: 1.4rem;
    }

    .product-card-name {
      margin-top: 0.25rem;
    }

    .product-card-price {
      margin-top: 0.15rem;
      font-weight: 600;
    }

    .basket-panel {
      background: #fff;
      border-radius: 0.75rem 0.75rem 0 0;
      padding: 0.75rem;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.08);
      position: sticky;
      bottom: 0;
    }

    #basketItems {
      max-height: 140px;
      overflow-y: auto;
      margin-bottom: 0.5rem;
    }

    .basket-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
      font-size: 0.85rem;
    }

    .basket-item-controls {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .basket-item-controls button {
      width: 24px;
      height: 24px;
    }

    .basket-summary {
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .basket-summary > div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.15rem;
    }

    .payment-methods {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .pay-btn {
      flex: 1;
      padding: 0.4rem;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #f9fafb;
      font-size: 0.8rem;
    }

    .pay-btn.active {
      background: #16a34a;
      color: #fff;
      border-color: #16a34a;
    }

    .cash-panel {
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .cash-display {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin-bottom: 0.25rem;
    }

    .primary-btn {
      width: 100%;
      padding: 0.6rem;
      border-radius: 999px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
    }

    .danger-btn {
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      border: none;
      background: #dc2626;
      color: #fff;
    }

    .inventory-header,
    .sales-header,
    .reports-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    #inventoryList .inventory-item {
      background: #fff;
      padding: 0.5rem;
      border-radius: 0.5rem;
      margin-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    #salesList .sale-item {
      background: #fff;
      padding: 0.5rem;
      border-radius: 0.5rem;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
    }

    #reportSummary {
      background: #fff;
      padding: 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      background: #fff;
      border-radius: 0.75rem;
      padding: 0.75rem;
      width: 95%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      margin-bottom: 0.5rem;
    }

    .modal-content label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 0.25rem;
    }

    .modal-content input,
    .modal-content textarea,
    .modal-content select {
      width: 100%;
      margin-bottom: 0.4rem;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
    }

    .scanner-modal {
      padding: 0;
    }

    .scanner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #eee;
    }

    .scanner-video-wrapper {
      position: relative;
      background: #000;
    }

    #scannerVideo {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
    }

    .scan-frame {
      position: absolute;
      inset: 15%;
      border: 2px solid rgba(255,255,255,0.7);
      border-radius: 0.75rem;
      overflow: hidden;
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(56,189,248,0.9);
      animation: scan 1.4s linear infinite;
    }

    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(100%); }
    }

    .scanner-controls {
      padding: 0.5rem 0.75rem 0.75rem;
    }

    .manual-barcode {
      display: flex;
      gap: 0.25rem;
      margin-top: 0.5rem;
    }

    .import-export-section {
      margin-bottom: 0.5rem;
    }

    #importJsonArea,
    #exportJsonArea {
      width: 100%;
      min-height: 80px;
      font-size: 0.75rem;
    }
  </style>

  <!-- jsPDF for PDF receipts & reports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- QRCode generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="store-title" id="storeTitle">Bazro POS</div>
    <div class="header-actions">
      <button id="importExportBtn">Import/Export</button>
      <button id="settingsBtn">⚙️</button>
    </div>
  </header>

  <main class="app-main">
    <nav class="bottom-nav">
      <button data-view="checkout" class="nav-btn active">Checkout</button>
      <button data-view="inventory" class="nav-btn">Inventory</button>
      <button data-view="sales" class="nav-btn">Sales</button>
      <button data-view="reports" class="nav-btn">Reports</button>
    </nav>

    <!-- Checkout View -->
    <section id="view-checkout" class="view active">
      <div class="checkout-top">
        <div class="search-bar">
          <input type="text" id="productSearch" placeholder="Search by name or barcode" />
          <button id="scanBarcodeBtn">📷</button>
        </div>
        <div class="category-filters" id="categoryFilters"></div>
      </div>

      <div class="product-grid" id="productGrid"></div>

      <div class="basket-panel">
        <h3>Basket</h3>
        <div id="basketItems"></div>
        <div class="basket-summary">
          <div>Subtotal: <span id="subtotalDisplay">£0.00</span></div>
          <div>Discount (%): <input type="number" id="discountPercent" value="0" min="0" max="100" /></div>
          <div>Tax: <span id="taxDisplay">£0.00</span></div>
          <div>Total: <span id="totalDisplay">£0.00</span></div>
        </div>
        <div class="payment-methods">
          <button data-method="cash" class="pay-btn active">Cash</button>
          <button data-method="card" class="pay-btn">Card</button>
          <button data-method="contactless" class="pay-btn">Contactless</button>
        </div>

        <div id="cashPanel" class="cash-panel">
          <div class="cash-display">
            <label>Cash given:</label>
            <input type="number" id="cashGiven" step="0.01" />
            <button id="cashQuick5">+5</button>
            <button id="cashQuick10">+10</button>
            <button id="cashQuick20">+20</button>
          </div>
          <div>Change: <span id="changeDisplay">0.00</span></div>
        </div>

        <button id="completeSaleBtn" class="primary-btn">Complete Sale</button>
      </div>
    </section>

    <!-- Inventory View -->
    <section id="view-inventory" class="view">
      <div class="inventory-header">
        <h2>Inventory</h2>
        <button id="addProductBtn" class="primary-btn">+ Add Product</button>
      </div>
      <div id="inventoryList"></div>
    </section>

    <!-- Sales History View -->
    <section id="view-sales" class="view">
      <div class="sales-header">
        <h2>Sales History</h2>
        <select id="salesFilter">
          <option value="today">Today</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
          <option value="all">All</option>
        </select>
      </div>
      <div id="salesList"></div>
    </section>

    <!-- Reports View -->
    <section id="view-reports" class="view">
      <div class="reports-header">
        <h2>End-of-day Report</h2>
        <button id="generateReportBtn" class="primary-btn">Generate PDF</button>
      </div>
      <div id="reportSummary"></div>
    </section>
  </main>

  <!-- Barcode Scanner Modal -->
  <div id="scannerModal" class="modal hidden">
    <div class="modal-content scanner-modal">
      <div class="scanner-header">
        <span>Scan Barcode</span>
        <button id="closeScannerBtn">✕</button>
      </div>
      <div class="scanner-video-wrapper">
        <video id="scannerVideo" autoplay playsinline></video>
        <div class="scan-frame">
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="scanner-controls">
        <button id="toggleFlashBtn">🔦 Flash</button>
        <div class="manual-barcode">
          <input type="text" id="manualBarcodeInput" placeholder="Enter barcode manually" />
          <button id="manualBarcodeSubmit">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Product Form Modal -->
  <div id="productModal" class="modal hidden">
    <div class="modal-content">
      <h3 id="productModalTitle">Add Product</h3>
      <form id="productForm">
        <input type="hidden" id="productId" />
        <label>Name <input type="text" id="productName" required /></label>
        <label>Emoji <input type="text" id="productEmoji" maxlength="2" /></label>
        <label>Category <input type="text" id="productCategory" /></label>
        <label>Price <input type="number" id="productPrice" step="0.01" required /></label>
        <label>Cost Price <input type="number" id="productCostPrice" step="0.01" /></label>
        <label>Stock Level <input type="number" id="productStock" /></label>
        <label>Low-stock Alert <input type="number" id="productLowStock" /></label>
        <label>Barcode <input type="text" id="productBarcode" /></label>
        <div class="modal-actions">
          <button type="button" id="deleteProductBtn" class="danger-btn hidden">Delete</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <h3>Settings</h3>
      <form id="settingsForm">
        <label>Store Name <input type="text" id="storeName" /></label>
        <label>Address <textarea id="storeAddress"></textarea></label>
        <label>VAT Number <input type="text" id="vatNumber" /></label>
        <label>Currency Symbol <input type="text" id="currencySymbol" value="£" /></label>
        <label>Tax Rate (%) <input type="number" id="taxRate" step="0.01" value="20" /></label>
        <label>Receipt Footer <textarea id="receiptFooter"></textarea></label>
        <div class="modal-actions">
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Import/Export Modal -->
  <div id="importExportModal" class="modal hidden">
    <div class="modal-content">
      <h3>Import / Export</h3>
      <div class="import-export-section">
        <button id="exportJsonBtn" class="primary-btn">Export JSON</button>
        <textarea id="exportJsonArea" readonly placeholder="Exported JSON will appear here"></textarea>
      </div>
      <div class="import-export-section">
        <textarea id="importJsonArea" placeholder="Paste JSON here to import"></textarea>
        <button id="importJsonBtn">Import JSON</button>
      </div>
      <button id="resetDefaultsBtn" class="danger-btn">Reset to defaults</button>
    </div>
  </div>

  <!-- App Logic -->
  <script>
    const DB_KEY = "bazro_pos_db_v1";

    const defaultDB = {
      settings: {
        storeName: "Bazro",
        address: "Your address here",
        vatNumber: "",
        currencySymbol: "£",
        taxRate: 20,
        receiptFooter: "Thank you for shopping at Bazro!"
      },
      products: [
        {
          id: "p1",
          name: "Apple",
          emoji: "🍎",
          category: "Fruit",
          price: 0.5,
          costPrice: 0.2,
          stock: 100,
          lowStock: 10,
          barcode: "111111"
        },
        {
          id: "p2",
          name: "Banana",
          emoji: "🍌",
          category: "Fruit",
          price: 0.4,
          costPrice: 0.15,
          stock: 80,
          lowStock: 10,
          barcode: "222222"
        }
      ],
      sales: []
    };

    let db = loadDB();
    let currentView = "checkout";
    let currentCategory = "All";
    let basket = [];
    let currentPaymentMethod = "cash";
    let currentSaleId = null;

    let scannerStream = null;
    let scannerTrack = null;
    let scannerTorchOn = false;

    document.addEventListener("DOMContentLoaded", () => {
      initNav();
      renderSettingsHeader();
      renderProducts();
      renderBasket();
      renderInventory();
      renderSales();
      renderReportSummary();

      initCheckoutEvents();
      initInventoryEvents();
      initSalesEvents();
      initReportEvents();
      initSettingsEvents();
      initImportExportEvents();
      initScannerEvents();
    });

    function loadDB() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (!raw) return structuredClone(defaultDB);
        return JSON.parse(raw);
      } catch {
        return structuredClone(defaultDB);
      }
    }

    function saveDB() {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    }

    function initNav() {
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const view = btn.dataset.view;
          currentView = view;
          document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
          document.getElementById(\`view-\${view}\").classList.add("active");
          if (view === "inventory") renderInventory();
          if (view === "sales") renderSales();
          if (view === "reports") renderReportSummary();
        });
      });
    }

    function renderSettingsHeader() {
      document.getElementById("storeTitle").textContent = db.settings.storeName || "Bazro POS";
    }

    function getFilteredProducts() {
      const search = document.getElementById("productSearch").value.trim().toLowerCase();
      return db.products.filter(p => {
        const matchesCategory = currentCategory === "All" || p.category === currentCategory;
        const matchesSearch =
          !search ||
          p.name.toLowerCase().includes(search) ||
          (p.barcode && p.barcode.toLowerCase().includes(search));
        return matchesCategory && matchesSearch;
      });
    }

    function renderCategoryFilters() {
      const container = document.getElementById("categoryFilters");
      container.innerHTML = "";
      const categories = ["All", ...new Set(db.products.map(p => p.category).filter(Boolean))];
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.textContent = cat || "Uncategorised";
        if (cat === currentCategory) btn.classList.add("active");
        btn.addEventListener("click", () => {
          currentCategory = cat;
          renderCategoryFilters();
          renderProducts();
        });
        container.appendChild(btn);
      });
    }

    function renderProducts() {
      renderCategoryFilters();
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";
      const products = getFilteredProducts();
      products.forEach(p => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = \`
          <div class="product-card-emoji">\${p.emoji || "📦"}</div>
          <div class="product-card-name">\${p.name}</div>
          <div class="product-card-price">\${db.settings.currencySymbol}\${p.price.toFixed(2)}</div>
        \`;
        card.addEventListener("click", () => addToBasket(p.id));
        grid.appendChild(card);
      });
    }

    function addToBasket(productId) {
      const existing = basket.find(b => b.productId === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        basket.push({ productId, qty: 1 });
      }
      renderBasket();
    }

    function updateBasketQty(productId, delta) {
      const item = basket.find(b => b.productId === productId);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        basket = basket.filter(b => b.productId !== productId);
      }
      renderBasket();
    }

    function renderBasket() {
      const container = document.getElementById("basketItems");
      container.innerHTML = "";
      let subtotal = 0;
      basket.forEach(item => {
        const product = db.products.find(p => p.id === item.productId);
        if (!product) return;
        const lineTotal = product.price * item.qty;
        subtotal += lineTotal;
        const row = document.createElement("div");
        row.className = "basket-item";
        row.innerHTML = \`
          <div>\${product.name} x \${item.qty}</div>
          <div class="basket-item-controls">
            <button data-action="dec">-</button>
            <button data-action="inc">+</button>
            <span>\${db.settings.currencySymbol}\${lineTotal.toFixed(2)}</span>
          </div>
        \`;
        const [decBtn, incBtn] = row.querySelectorAll("button");
        decBtn.addEventListener("click", () => updateBasketQty(product.id, -1));
        incBtn.addEventListener("click", () => updateBasketQty(product.id, 1));
        container.appendChild(row);
      });

      const discountPercent = parseFloat(document.getElementById("discountPercent").value || "0");
      const discountAmount = subtotal * (discountPercent / 100);
      const taxable = subtotal - discountAmount;
      const taxRate = db.settings.taxRate || 0;
      const tax = taxable * (taxRate / 100);
      const total = taxable + tax;

      document.getElementById("subtotalDisplay").textContent = formatMoney(subtotal);
      document.getElementById("taxDisplay").textContent = formatMoney(tax);
      document.getElementById("totalDisplay").textContent = formatMoney(total);

      updateChangeDisplay();
    }

    function formatMoney(value) {
      return db.settings.currencySymbol + (isNaN(value) ? "0.00" : value.toFixed(2));
    }

    function initCheckoutEvents() {
      document.getElementById("productSearch").addEventListener("input", renderProducts);
      document.getElementById("discountPercent").addEventListener("input", renderBasket);

      document.querySelectorAll(".pay-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".pay-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentPaymentMethod = btn.dataset.method;
          document.getElementById("cashPanel").style.display =
            currentPaymentMethod === "cash" ? "block" : "none";
        });
      });

      document.getElementById("cashGiven").addEventListener("input", updateChangeDisplay);
      document.getElementById("cashQuick5").addEventListener("click", () => addCashQuick(5));
      document.getElementById("cashQuick10").addEventListener("click", () => addCashQuick(10));
      document.getElementById("cashQuick20").addEventListener("click", () => addCashQuick(20));

      document.getElementById("completeSaleBtn").addEventListener("click", completeSale);
      document.getElementById("scanBarcodeBtn").addEventListener("click", openScannerModal);
    }

    function addCashQuick(amount) {
      const input = document.getElementById("cashGiven");
      const current = parseFloat(input.value || "0");
      input.value = (current + amount).toFixed(2);
      updateChangeDisplay();
    }

    function updateChangeDisplay() {
      const totalText = document.getElementById("totalDisplay").textContent.replace(db.settings.currencySymbol, "");
      const total = parseFloat(totalText) || 0;
      const cashGiven = parseFloat(document.getElementById("cashGiven").value || "0");
      const change = Math.max(0, cashGiven - total);
      document.getElementById("changeDisplay").textContent = change.toFixed(2);
    }

    function completeSale() {
      if (basket.length === 0) {
        alert("Basket is empty.");
        return;
      }

      const discountPercent = parseFloat(document.getElementById("discountPercent").value || "0");
      const subtotal = basket.reduce((sum, item) => {
        const product = db.products.find(p => p.id === item.productId);
        return sum + (product ? product.price * item.qty : 0);
      }, 0);
      const discountAmount = subtotal * (discountPercent / 100);
      const taxable = subtotal - discountAmount;
      const taxRate = db.settings.taxRate || 0;
      const tax = taxable * (taxRate / 100);
      const total = taxable + tax;

      if (currentPaymentMethod === "cash") {
        const cashGiven = parseFloat(document.getElementById("cashGiven").value || "0");
        if (cashGiven < total) {
          if (!confirm("Cash given is less than total. Continue?")) return;
        }
      }

      const saleId = "S" + Date.now();
      currentSaleId = saleId;

      basket.forEach(item => {
        const product = db.products.find(p => p.id === item.productId);
        if (product && typeof product.stock === "number") {
          product.stock = Math.max(0, product.stock - item.qty);
        }
      });

      const sale = {
        id: saleId,
        timestamp: Date.now(),
        items: basket.map(item => {
          const product = db.products.find(p => p.id === item.productId);
          return {
            productId: item.productId,
            name: product ? product.name : "",
            price: product ? product.price : 0,
            qty: item.qty
          };
        }),
        subtotal,
        discountPercent,
        discountAmount,
        tax,
        total,
        paymentMethod: currentPaymentMethod
      };

      db.sales.push(sale);
      saveDB();

      basket = [];
      document.getElementById("discountPercent").value = 0;
      document.getElementById("cashGiven").value = "";
      renderBasket();
      renderInventory();
      renderSales();
      renderReportSummary();

      generateReceiptPDF(sale);
      alert("Sale completed and receipt generated.");
    }

    function generateReceiptPDF(sale) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const s = db.settings;
      let y = 10;

      doc.setFontSize(14);
      doc.text(s.storeName || "Bazro", 10, y);
      y += 6;
      doc.setFontSize(10);
      if (s.address) {
        const lines = doc.splitTextToSize(s.address, 180);
        lines.forEach(line => {
          doc.text(line, 10, y);
          y += 4;
        });
      }
      if (s.vatNumber) {
        doc.text(\`VAT: \${s.vatNumber}\`, 10, y);
        y += 5;
      }

      doc.text(\`Sale ID: \${sale.id}\`, 10, y);
      y += 5;
      doc.text(\`Date: \${new Date(sale.timestamp).toLocaleString()}\`, 10, y);
      y += 6;

      doc.text("Items:", 10, y);
      y += 4;

      sale.items.forEach(item => {
        const line = \`\${item.name} x\${item.qty} @ \${s.currencySymbol}\${item.price.toFixed(2)}\`;
        doc.text(line, 10, y);
        doc.text(\`\${s.currencySymbol}\${(item.price * item.qty).toFixed(2)}\`, 170, y, { align: "right" });
        y += 4;
      });

      y += 2;
      doc.text(\`Subtotal: \${s.currencySymbol}\${sale.subtotal.toFixed(2)}\`, 10, y);
      y += 4;
      doc.text(\`Discount (\${sale.discountPercent}%): -\${s.currencySymbol}\${sale.discountAmount.toFixed(2)}\`, 10, y);
      y += 4;
      doc.text(\`Tax (\${s.taxRate}%): \${s.currencySymbol}\${sale.tax.toFixed(2)}\`, 10, y);
      y += 4;
      doc.setFontSize(12);
      doc.text(\`Total: \${s.currencySymbol}\${sale.total.toFixed(2)}\`, 10, y);
      y += 6;
      doc.setFontSize(10);
      doc.text(\`Payment: \${sale.paymentMethod}\`, 10, y);
      y += 8;

      if (s.receiptFooter) {
        const lines = doc.splitTextToSize(s.receiptFooter, 180);
        lines.forEach(line => {
          doc.text(line, 10, y);
          y += 4;
        });
      }

      const qrDiv = document.createElement("div");
      new QRCode(qrDiv, {
        text: sale.id,
        width: 80,
        height: 80
      });
      const img = qrDiv.querySelector("img");
      if (img) {
        const qrData = img.src;
        doc.addImage(qrData, "PNG", 150, 10, 40, 40);
      }

      doc.save(\`receipt_\${sale.id}.pdf\`);
    }

    function renderInventory() {
      const list = document.getElementById("inventoryList");
      list.innerHTML = "";
      db.products.forEach(p => {
        const item = document.createElement("div");
        item.className = "inventory-item";
        const lowStock = typeof p.lowStock === "number" && typeof p.stock === "number" && p.stock <= p.lowStock;
        item.innerHTML = \`
          <div>
            <div>\${p.emoji || "📦"} \${p.name}</div>
            <div style="font-size:0.75rem;color:#555;">
              \${p.category || "Uncategorised"} • Stock: \${p.stock ?? "-"} • £\${p.price.toFixed(2)}
            </div>
            \${lowStock ? '<div style="color:#dc2626;font-size:0.75rem;">Low stock alert</div>' : ""}
          </div>
          <button>Edit</button>
        \`;
        item.querySelector("button").addEventListener("click", () => openProductModal(p.id));
        list.appendChild(item);
      });
    }

    function initInventoryEvents() {
      document.getElementById("addProductBtn").addEventListener("click", () => openProductModal(null));
      document.getElementById("productForm").addEventListener("submit", saveProductFromForm);
      document.getElementById("deleteProductBtn").addEventListener("click", deleteProductFromForm);
    }

    function openProductModal(productId) {
      const modal = document.getElementById("productModal");
      const title = document.getElementById("productModalTitle");
      const deleteBtn = document.getElementById("deleteProductBtn");

      if (productId) {
        const p = db.products.find(p => p.id === productId);
        if (!p) return;
        title.textContent = "Edit Product";
        deleteBtn.classList.remove("hidden");
        document.getElementById("productId").value = p.id;
        document.getElementById("productName").value = p.name;
        document.getElementById("productEmoji").value = p.emoji || "";
        document.getElementById("productCategory").value = p.category || "";
        document.getElementById("productPrice").value = p.price;
        document.getElementById("productCostPrice").value = p.costPrice ?? "";
        document.getElementById("productStock").value = p.stock ?? "";
        document.getElementById("productLowStock").value = p.lowStock ?? "";
        document.getElementById("productBarcode").value = p.barcode || "";
      } else {
        title.textContent = "Add Product";
        deleteBtn.classList.add("hidden");
        document.getElementById("productForm").reset();
        document.getElementById("productId").value = "";
      }

      modal.classList.remove("hidden");
      modal.addEventListener("click", e => {
        if (e.target === modal) modal.classList.add("hidden");
      }, { once: true });
    }

    function saveProductFromForm(e) {
      e.preventDefault();
      const id = document.getElementById("productId").value || "p" + Date.now();
      const existingIndex = db.products.findIndex(p => p.id === id);
      const product = {
        id,
        name: document.getElementById("productName").value.trim(),
        emoji: document.getElementById("productEmoji").value.trim(),
        category: document.getElementById("productCategory").value.trim(),
        price: parseFloat(document.getElementById("productPrice").value || "0"),
        costPrice: parseFloat(document.getElementById("productCostPrice").value || "0"),
        stock: parseInt(document.getElementById("productStock").value || "0", 10),
        lowStock: parseInt(document.getElementById("productLowStock").value || "0", 10),
        barcode: document.getElementById("productBarcode").value.trim()
      };

      if (!product.name) {
        alert("Name is required");
        return;
      }

      if (existingIndex >= 0) {
        db.products[existingIndex] = product;
      } else {
        db.products.push(product);
      }
      saveDB();
      renderProducts();
      renderInventory();
      document.getElementById("productModal").classList.add("hidden");
    }

    function deleteProductFromForm() {
      const id = document.getElementById("productId").value;
      if (!id) return;
      if (!confirm("Delete this product?")) return;
      db.products = db.products.filter(p => p.id !== id);
      saveDB();
      renderProducts();
      renderInventory();
      document.getElementById("productModal").classList.add("hidden");
    }

    function initSalesEvents() {
      document.getElementById("salesFilter").addEventListener("change", renderSales);
    }

    function renderSales() {
      const filter = document.getElementById("salesFilter").value;
      const list = document.getElementById("salesList");
      list.innerHTML = "";

      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const startOfWeek = startOfToday - (now.getDay() || 7) * 24 * 60 * 60 * 1000;
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

      const filtered = db.sales.filter(sale => {
        const t = sale.timestamp;
        if (filter === "today") return t >= startOfToday;
        if (filter === "week") return t >= startOfWeek;
        if (filter === "month") return t >= startOfMonth;
        return true;
      });

      filtered.sort((a, b) => b.timestamp - a.timestamp);

      filtered.forEach(sale => {
        const item = document.createElement("div");
        item.className = "sale-item";
        item.innerHTML = \`
          <div><strong>\${sale.id}</strong></div>
          <div style="font-size:0.75rem;color:#555;">\${new Date(sale.timestamp).toLocaleString()}</div>
          <div style="font-size:0.8rem;">Total: \${db.settings.currencySymbol}\${sale.total.toFixed(2)} • \${sale.paymentMethod}</div>
          <button style="margin-top:0.25rem;">View</button>
        \`;
        item.querySelector("button").addEventListener("click", () => viewSaleDetails(sale));
        list.appendChild(item);
      });
    }

    function viewSaleDetails(sale) {
      const lines = sale.items.map(i => \`\${i.name} x\${i.qty} = \${db.settings.currencySymbol}\${(i.price * i.qty).toFixed(2)}\`).join("\\n");
      const msg =
        \`Sale ID: \${sale.id}\\n\` +
        \`Date: \${new Date(sale.timestamp).toLocaleString()}\\n\` +
        \`Items:\\n\${lines}\\n\\n\` +
        \`Subtotal: \${db.settings.currencySymbol}\${sale.subtotal.toFixed(2)}\\n\` +
        \`Discount: \${db.settings.currencySymbol}\${sale.discountAmount.toFixed(2)}\\n\` +
        \`Tax: \${db.settings.currencySymbol}\${sale.tax.toFixed(2)}\\n\` +
        \`Total: \${db.settings.currencySymbol}\${sale.total.toFixed(2)}\\n\` +
        \`Payment: \${sale.paymentMethod}\\n\\n\` +
        \`Re-download receipt?\`;
      if (confirm(msg)) {
        generateReceiptPDF(sale);
      }
    }

    function initReportEvents() {
      document.getElementById("generateReportBtn").addEventListener("click", generateReportPDF);
    }

    function computeTodaySales() {
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const todaySales = db.sales.filter(s => s.timestamp >= startOfToday);
      const revenue = todaySales.reduce((sum, s) => sum + s.total, 0);
      const byProduct = {};
      const byPayment = {};

      todaySales.forEach(sale => {
        byPayment[sale.paymentMethod] = (byPayment[sale.paymentMethod] || 0) + sale.total;
        sale.items.forEach(i => {
          byProduct[i.name] = (byProduct[i.name] || 0) + i.qty;
        });
      });

      const topProducts = Object.entries(byProduct)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      const lowStock = db.products.filter(p => typeof p.lowStock === "number" && typeof p.stock === "number" && p.stock <= p.lowStock);

      return { todaySales, revenue, byPayment, topProducts, lowStock };
    }

    function renderReportSummary() {
      const summary = document.getElementById("reportSummary");
      const { revenue, byPayment, topProducts, lowStock } = computeTodaySales();
      const s = db.settings;

      let html = "";
      html += \`<div>Total revenue today: <strong>\${s.currencySymbol}\${revenue.toFixed(2)}</strong></div>\`;
      html += \`<div style="margin-top:0.25rem;">Payment breakdown:</div>\`;
      html += \`<ul style="margin-left:1rem;font-size:0.8rem;">\`;
      Object.entries(byPayment).forEach(([method, amount]) => {
        html += \`<li>\${method}: \${s.currencySymbol}\${amount.toFixed(2)}</li>\`;
      });
      html += \`</ul>\`;

      html += \`<div style="margin-top:0.25rem;">Top products:</div>\`;
      html += \`<ul style="margin-left:1rem;font-size:0.8rem;">\`;
      topProducts.forEach(([name, qty]) => {
        html += \`<li>\${name}: \${qty}</li>\`;
      });
      html += \`</ul>\`;

      html += \`<div style="margin-top:0.25rem;">Stock alerts:</div>\`;
      if (lowStock.length === 0) {
        html += \`<div style="font-size:0.8rem;">No low-stock items.</div>\`;
      } else {
        html += \`<ul style="margin-left:1rem;font-size:0.8rem;">\`;
        lowStock.forEach(p => {
          html += \`<li>\${p.name} — Stock: \${p.stock}</li>\`;
        });
        html += \`</ul>\`;
      }

      summary.innerHTML = html;
    }

    function generateReportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const { revenue, byPayment, topProducts, lowStock } = computeTodaySales();
      const s = db.settings;
      let y = 10;

      doc.setFontSize(14);
      doc.text(\`\${s.storeName || "Bazro"} — End-of-day Report\`, 10, y);
      y += 6;
      doc.setFontSize(10);
      doc.text(\`Date: \${new Date().toLocaleDateString()}\`, 10, y);
      y += 8;

      doc.text(\`Total revenue: \${s.currencySymbol}\${revenue.toFixed(2)}\`, 10, y);
      y += 6;

      doc.text("Payment breakdown:", 10, y);
      y += 4;
      Object.entries(byPayment).forEach(([method, amount]) => {
        doc.text(\`- \${method}: \${s.currencySymbol}\${amount.toFixed(2)}\`, 12, y);
        y += 4;
      });

      y += 4;
      doc.text("Top products:", 10, y);
      y += 4;
      topProducts.forEach(([name, qty]) => {
        doc.text(\`- \${name}: \${qty}\`, 12, y);
        y += 4;
      });

      y += 4;
      doc.text("Stock alerts:", 10, y);
      y += 4;
      if (lowStock.length === 0) {
        doc.text("- None", 12, y);
      } else {
        lowStock.forEach(p => {
          doc.text(\`- \${p.name}: stock \${p.stock}\`, 12, y);
          y += 4;
        });
      }

      doc.save(\`report_\${new Date().toISOString().slice(0,10)}.pdf\`);
    }

    function initSettingsEvents() {
      document.getElementById("settingsBtn").addEventListener("click", openSettingsModal);
      document.getElementById("settingsForm").addEventListener("submit", saveSettingsFromForm);
    }

    function openSettingsModal() {
      const s = db.settings;
      document.getElementById("storeName").value = s.storeName || "";
      document.getElementById("storeAddress").value = s.address || "";
      document.getElementById("vatNumber").value = s.vatNumber || "";
      document.getElementById("currencySymbol").value = s.currencySymbol || "£";
      document.getElementById("taxRate").value = s.taxRate ?? 20;
      document.getElementById("receiptFooter").value = s.receiptFooter || "";

      const modal = document.getElementById("settingsModal");
      modal.classList.remove("hidden");
      modal.addEventListener("click", e => {
        if (e.target === modal) modal.classList.add("hidden");
      }, { once: true });
    }

    function saveSettingsFromForm(e) {
      e.preventDefault();
      db.settings.storeName = document.getElementById("storeName").value.trim() || "Bazro";
      db.settings.address = document.getElementById("storeAddress").value.trim();
      db.settings.vatNumber = document.getElementById("vatNumber").value.trim();
      db.settings.currencySymbol = document.getElementById("currencySymbol").value || "£";
      db.settings.taxRate = parseFloat(document.getElementById("taxRate").value || "0");
      db.settings.receiptFooter = document.getElementById("receiptFooter").value.trim();
      saveDB();
      renderSettingsHeader();
      renderBasket();
      document.getElementById("settingsModal").classList.add("hidden");
    }

    function initImportExportEvents() {
      document.getElementById("importExportBtn").addEventListener("click", () => {
        document.getElementById("exportJsonArea").value = "";
        document.getElementById("importJsonArea").value = "";
        const modal = document.getElementById("importExportModal");
        modal.classList.remove("hidden");
        modal.addEventListener("click", e => {
          if (e.target === modal) modal.classList.add("hidden");
        }, { once: true });
      });

      document.getElementById("exportJsonBtn").addEventListener("click", () => {
        document.getElementById("exportJsonArea").value = JSON.stringify(db, null, 2);
      });

      document.getElementById("importJsonBtn").addEventListener("click", () => {
        const text = document.getElementById("importJsonArea").value.trim();
        if (!text) return;
        try {
          const imported = JSON.parse(text);
          db = imported;
          saveDB();
          renderSettingsHeader();
          renderProducts();
          renderBasket();
          renderInventory();
          renderSales();
          renderReportSummary();
          alert("Import successful.");
        } catch {
          alert("Invalid JSON.");
        }
      });

      document.getElementById("resetDefaultsBtn").addEventListener("click", () => {
        if (!confirm("Reset to defaults? This will erase current data.")) return;
        db = structuredClone(defaultDB);
        saveDB();
        renderSettingsHeader();
        renderProducts();
        renderBasket();
        renderInventory();
        renderSales();
        renderReportSummary();
        alert("Reset complete.");
      });
    }

    function initScannerEvents() {
      document.getElementById("closeScannerBtn").addEventListener("click", closeScannerModal);
      document.getElementById("manualBarcodeSubmit").addEventListener("click", () => {
        const code = document.getElementById("manualBarcodeInput").value.trim();
        if (!code) return;
        handleBarcodeDetected(code);
      });
      document.getElementById("toggleFlashBtn").addEventListener("click", toggleFlashlight);
    }

    async function openScannerModal() {
      const modal = document.getElementById("scannerModal");
      modal.classList.remove("hidden");
      modal.addEventListener("click", e => {
        if (e.target === modal) closeScannerModal();
      }, { once: true });

      const video = document.getElementById("scannerVideo");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        scannerStream = stream;
        video.srcObject = stream;
        const tracks = stream.getVideoTracks();
        scannerTrack = tracks[0] || null;
      } catch (err) {
        alert("Camera not available. Use manual barcode entry.");
      }
    }

    function closeScannerModal() {
      const modal = document.getElementById("scannerModal");
      modal.classList.add("hidden");
      if (scannerStream) {
        scannerStream.getTracks().forEach(t => t.stop());
        scannerStream = null;
        scannerTrack = null;
        scannerTorchOn = false;
      }
    }

    async function toggleFlashlight() {
      if (!scannerTrack) {
        alert("Flashlight not supported on this device.");
        return;
      }
      try {
        const capabilities = scannerTrack.getCapabilities();
        if (!capabilities.torch) {
          alert("Torch not supported.");
          return;
        }
        scannerTorchOn = !scannerTorchOn;
        await scannerTrack.applyConstraints({ advanced: [{ torch: scannerTorchOn }] });
      } catch {
        alert("Unable to toggle torch.");
      }
    }

    function handleBarcodeDetected(code) {
      const product = db.products.find(p => p.barcode === code);
      if (product) {
        addToBasket(product.id);
        closeScannerModal();
      } else {
        if (confirm(\`No product with barcode \${code}. Add to inventory?\`)) {
          closeScannerModal();
          openProductModal(null);
          document.getElementById("productBarcode").value = code;
        }
      }
    }
  </script>
</body>
</html>
