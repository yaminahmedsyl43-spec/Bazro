<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bazro POS - Inventory & Scanner</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #1a1a24;
            --border: #2a2a3a;
            --accent: #00e5a0;
            --accent2: #7c5cfc;
            --text: #e8e8f0;
            --text2: #8888aa;
            --danger: #ff4444;
            --success: #00e5a0;
            --warning: #ffb020;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* ─── LAYOUT ─────────────────────────────────────── */
        #app { display: flex; height: 100vh; overflow: hidden; }

        #sidebar {
            width: 220px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .logo { padding: 24px 20px; border-bottom: 1px solid var(--border); }
        .logo h1 {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        nav { flex: 1; padding: 12px 0; }
        .nav-btn {
            width: 100%; background: none; border: none; color: var(--text2);
            font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600;
            padding: 12px 20px; text-align: left; cursor: pointer;
            display: flex; align-items: center; gap: 12px; border-left: 3px solid transparent;
        }
        .nav-btn.active { color: var(--accent); background: rgba(0,229,160,0.08); border-left-color: var(--accent); }

        /* ─── MAIN CONTENT ───────────────────────────────── */
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .page { display: none; flex: 1; overflow: hidden; }
        .page.active { display: flex; }

        /* Checkout Page */
        #products-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .panel-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; background: var(--surface); }
        .search-box { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; color: var(--text); outline: none; }
        
        .btn-scan { background: var(--accent2); border: none; border-radius: var(--radius); padding: 10px 16px; color: white; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }

        #product-grid { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; transition: 0.2s; }
        .product-card:hover { border-color: var(--accent); transform: translateY(-2px); }

        #basket-panel { width: 340px; background: var(--surface); display: flex; flex-direction: column; }
        #basket-items { flex: 1; overflow-y: auto; padding: 12px; }
        #basket-footer { padding: 16px; border-top: 1px solid var(--border); }

        /* ─── MODALS ─────────────────────────────────────── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 90%; max-width: 480px; }
        
        /* Scanner Specific */
        #reader { width: 100% !important; border: none !important; border-radius: 12px; overflow: hidden; }
        #reader__dashboard_section_csr_button { background: var(--accent) !important; color: black !important; font-weight: bold !important; border-radius: 8px !important; }

        /* Numpad Styling */
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .numpad-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 15px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; cursor: pointer; }
        .numpad-btn:active { background: var(--accent2); }

        .btn-primary { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: var(--radius); font-weight: 800; cursor: pointer; margin-top: 10px; }

        /* Responsive Mobile Fixes */
        @media (max-width: 768px) {
            #sidebar { width: 70px; }
            .logo h1, .nav-btn span:last-child { display: none; }
            #basket-panel { display: none; } /* On mobile, basket is usually a separate view or modal */
        }
    </style>
</head>
<body>

<div id="app">
    <aside id="sidebar">
        <div class="logo"><h1>Bazro</h1></div>
        <nav>
            <button class="nav-btn active" onclick="showPage('checkout')">🛒 <span>Checkout</span></button>
            <button class="nav-btn" onclick="showPage('inventory')">📦 <span>Inventory</span></button>
            <button class="nav-btn" onclick="showPage('settings')">⚙️ <span>Settings</span></button>
        </nav>
    </aside>

    <main id="main">
        <section id="page-checkout" class="page active">
            <div id="products-panel">
                <div class="panel-header">
                    <input class="search-box" id="search-input" placeholder="Search products..." oninput="renderProducts()">
                    <button class="btn-scan" onclick="openScanner('checkout')">📷 Scan</button>
                </div>
                <div id="product-grid"></div>
            </div>
            <aside id="basket-panel">
                <div style="padding:16px; border-bottom:1px solid var(--border)"><h2>Basket</h2></div>
                <div id="basket-items"></div>
                <div id="basket-footer">
                    <div style="display:flex; justify-content:space-between; font-size: 20px; font-weight:800; margin-bottom:10px;">
                        <span>Total</span><span id="basket-total">£0.00</span>
                    </div>
                    <button class="btn-primary" onclick="openPayment()">Pay Now</button>
                </div>
            </aside>
        </section>

        <section id="page-inventory" class="page">
            <div class="panel-header" style="width:100%">
                <h2>Inventory</h2>
                <button class="btn-scan" onclick="openScanner('inventory')">📷 Find Item</button>
                <button class="btn-scan" style="background:var(--accent)" onclick="openItemModal()">+ Add Item</button>
            </div>
            <div style="padding:20px; overflow-y:auto; width:100%">
                <table style="width:100%; border-collapse: collapse;">
                    <thead style="text-align:left; color:var(--text2); font-size:12px;">
                        <tr><th>ITEM</th><th>SKU</th><th>STOCK</th><th>PRICE</th></tr>
                    </thead>
                    <tbody id="inventory-list"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="scanner-modal">
    <div class="modal">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <h3>Barcode Scanner</h3>
            <button onclick="closeScanner()" style="background:none; border:none; color:var(--text2); font-size:20px; cursor:pointer;">✕</button>
        </div>
        <div id="reader"></div>
        <p style="text-align:center; margin-top:15px; color:var(--text2);">Place barcode inside the area</p>
    </div>
</div>

<div class="modal-overlay" id="payment-modal">
    <div class="modal">
        <h3>Cash Payment</h3>
        <h1 id="pay-amount-display" style="text-align:center; color:var(--accent); font-size:40px; margin:20px 0;">£0.00</h1>
        <input type="number" id="cash-tendered" placeholder="0.00" style="width:100%; background:var(--surface2); border:1px solid var(--border); padding:15px; color:white; font-size:24px; text-align:center; border-radius:8px;">
        
        <div class="numpad">
            <button class="numpad-btn" onclick="appendNum('7')">7</button><button class="numpad-btn" onclick="appendNum('8')">8</button><button class="numpad-btn" onclick="appendNum('9')">9</button>
            <button class="numpad-btn" onclick="appendNum('4')">4</button><button class="numpad-btn" onclick="appendNum('5')">5</button><button class="numpad-btn" onclick="appendNum('6')">6</button>
            <button class="numpad-btn" onclick="appendNum('1')">1</button><button class="numpad-btn" onclick="appendNum('2')">2</button><button class="numpad-btn" onclick="appendNum('3')">3</button>
            <button class="numpad-btn" onclick="appendNum('0')">0</button><button class="numpad-btn" onclick="appendNum('.')">.</button><button class="numpad-btn" style="color:var(--danger)" onclick="document.getElementById('cash-tendered').value=''">C</button>
        </div>
        <button class="btn-primary" onclick="completeSale()">Confirm Transaction</button>
        <button class="btn-primary" style="background:var(--surface2); color:white;" onclick="closePayment()">Cancel</button>
    </div>
</div>

<script>
    // --- APP STATE ---
    let inventory = JSON.parse(localStorage.getItem('bazro_inv')) || [
        { id: 1, name: "Energy Drink", sku: "123456", price: 2.50, stock: 24 },
        { id: 2, name: "Organic Bread", sku: "987654", price: 1.20, stock: 10 }
    ];
    let basket = [];
    let html5QrCode = null;
    let currentScanMode = 'checkout';

    // --- NAVIGATION ---
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + id).classList.add('active');
        event.currentTarget.classList.add('active');
        if(id === 'inventory') renderInventory();
    }

    // --- SCANNER LOGIC ---
    function openScanner(mode) {
        currentScanMode = mode;
        document.getElementById('scanner-modal').classList.add('open');
        
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 150 } };

        html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
            handleScanResult(decodedText);
            closeScanner();
        }).catch(err => {
            alert("Camera Error: Please ensure you are on HTTPS and have given camera permissions.");
            closeScanner();
        });
    }

    function closeScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('scanner-modal').classList.remove('open');
            }).catch(() => {
                document.getElementById('scanner-modal').classList.remove('open');
            });
        } else {
            document.getElementById('scanner-modal').classList.remove('open');
        }
    }

    function handleScanResult(sku) {
        const item = inventory.find(i => i.sku === sku);
        if (!item) {
            alert("Item with SKU " + sku + " not found!");
            return;
        }

        if (currentScanMode === 'checkout') {
            addToBasket(item);
        } else {
            alert(`Found: ${item.name} | Stock: ${item.stock}`);
            // Logic to open edit modal can go here
        }
    }

    // --- POS LOGIC ---
    function renderProducts() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const grid = document.getElementById('product-grid');
        grid.innerHTML = inventory
            .filter(i => i.name.toLowerCase().includes(query))
            .map(item => `
                <div class="product-card" onclick='addToBasket(${JSON.stringify(item)})'>
                    <div style="font-size:30px; margin-bottom:10px;">📦</div>
                    <strong>${item.name}</strong><br>
                    <small style="color:var(--accent)">£${item.price.toFixed(2)}</small>
                </div>
            `).join('');
    }

    function addToBasket(item) {
        basket.push(item);
        renderBasket();
    }

    function renderBasket() {
        const container = document.getElementById('basket-items');
        let total = 0;
        container.innerHTML = basket.map((item, idx) => {
            total += item.price;
            return `
                <div style="display:flex; justify-content:space-between; background:var(--surface2); padding:10px; border-radius:8px; margin-bottom:8px;">
                    <span>${item.name}</span>
                    <strong>£${item.price.toFixed(2)}</strong>
                </div>
            `;
        }).join('');
        document.getElementById('basket-total').innerText = `£${total.toFixed(2)}`;
    }

    function openPayment() {
        if (basket.length === 0) return alert("Basket is empty!");
        document.getElementById('pay-amount-display').innerText = document.getElementById('basket-total').innerText;
        document.getElementById('payment-modal').classList.add('open');
    }

    function closePayment() {
        document.getElementById('payment-modal').classList.remove('open');
    }

    function appendNum(n) {
        document.getElementById('cash-tendered').value += n;
    }

    function completeSale() {
        alert("Sale Complete! Printing receipt...");
        basket = [];
        renderBasket();
        closePayment();
    }

    function renderInventory() {
        const list = document.getElementById('inventory-list');
        list.innerHTML = inventory.map(item => `
            <tr style="border-bottom: 1px solid var(--border);">
                <td style="padding:12px 0;">${item.name}</td>
                <td><code>${item.sku}</code></td>
                <td>${item.stock}</td>
                <td style="color:var(--accent)">£${item.price.toFixed(2)}</td>
            </tr>
        `).join('');
    }

    // Init
    renderProducts();
</script>

</body>
</html>
