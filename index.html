<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazro POS</title>

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:linear-gradient(135deg,#1f1c2c,#928dab);
}
header{
  background:linear-gradient(135deg,#ff2a2a,#ff6a00);
  padding:16px;
  text-align:center;
}
header img{height:50px}
.container{
  max-width:520px;
  margin:auto;
  padding:15px;
}
.card{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}
input,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ddd;
}
button{
  border:none;
  background:linear-gradient(135deg,#ff2a2a,#ff6a00);
  color:white;
  font-weight:700;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:6px 0;
}
.qty{
  display:flex;
  gap:6px;
  align-items:center;
}
.qty button{
  width:36px;
  padding:6px;
}
.total{
  text-align:right;
  font-size:18px;
  font-weight:800;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <img src="bazro-logo.png" alt="Bazro">
</header>

<div class="container">

<div class="card">
<h3>Add Product</h3>
<input id="barcode" placeholder="Barcode">
<input id="name" placeholder="Product name">
<input id="price" type="number" placeholder="Price">
<input id="stock" type="number" placeholder="Stock">
<button onclick="addProduct()">Save Product</button>
</div>

<div class="card">
<h3>Sell Products</h3>
<input id="sellBarcode" placeholder="Barcode">
<button onclick="addToCart()">Add</button>

<div id="cart"></div>
<div class="total" id="total">Total: £0.00</div>

<button onclick="checkout()">Checkout</button>
<button onclick="downloadLastReceipt()">📥 Download Receipt</button>
<button onclick="downloadDaily()">📦 Download Today Sales</button>
</div>

</div>

<script>
let products = JSON.parse(localStorage.getItem("products")) || {};
let sales = JSON.parse(localStorage.getItem("sales")) || [];
let cart = [];

function addProduct(){
  const b = barcode.value.trim();
  const n = name.value.trim();
  const p = price.value;
  const s = stock.value || 0;

  if(b === "" || n === "" || p === ""){
    alert("Please enter barcode, name and price");
    return;
  }

  products[b] = {
    name: n,
    price: parseFloat(p),
    stock: parseInt(s)
  };

  localStorage.setItem("products", JSON.stringify(products));

  barcode.value = "";
  name.value = "";
  price.value = "";
  stock.value = "";

  alert("Product saved");
}

function addToCart(){
  const b = sellBarcode.value.trim();
  const p = products[b];

  if(!p){
    alert("Product not found");
    return;
  }
  if(p.stock <= 0){
    alert("Out of stock");
    return;
  }

  let item = cart.find(i => i.barcode === b);
  if(item){
    item.qty++;
  }else{
    cart.push({barcode:b,name:p.name,price:p.price,qty:1});
  }

  p.stock--;
  localStorage.setItem("products", JSON.stringify(products));
  sellBarcode.value = "";
  renderCart();
}

function changeQty(barcode,delta){
  let item = cart.find(i => i.barcode === barcode);
  if(!item) return;

  if(delta > 0 && products[barcode].stock <= 0) return;

  item.qty += delta;
  products[barcode].stock -= delta;

  if(item.qty <= 0){
    cart = cart.filter(i => i.barcode !== barcode);
  }

  localStorage.setItem("products", JSON.stringify(products));
  renderCart();
}

function renderCart(){
  let total = 0;
  const div = document.getElementById("cart");

  div.innerHTML = cart.map(i=>{
    let line = i.price * i.qty;
    total += line;
    return `
      <div class="cart-item">
        <span>${i.name}<br>£${i.price.toFixed(2)}</span>
        <div class="qty">
          <button onclick="changeQty('${i.barcode}',-1)">−</button>
          <strong>${i.qty}</strong>
          <button onclick="changeQty('${i.barcode}',1)">+</button>
        </div>
        <strong>£${line.toFixed(2)}</strong>
      </div>
    `;
  }).join("");

  document.getElementById("total").innerText = `Total: £${total.toFixed(2)}`;
}

function checkout(){
  if(cart.length === 0){
    alert("Cart empty");
    return;
  }

  sales.push({
    date: new Date().toLocaleString(),
    items: JSON.parse(JSON.stringify(cart))
  });

  localStorage.setItem("sales", JSON.stringify(sales));
  cart = [];
  renderCart();
  alert("Sale saved");
}

function downloadLastReceipt(){
  if(sales.length === 0) return;

  const s = sales[sales.length - 1];
  let total = 0;
  let text = `BAZRO RECEIPT\n${s.date}\n----------------\n`;

  s.items.forEach(i=>{
    let l = i.price * i.qty;
    total += l;
    text += `${i.qty}x ${i.name} £${l.toFixed(2)}\n`;
  });

  text += `----------------\nTOTAL £${total.toFixed(2)}`;
  download(text, `receipt_${Date.now()}.txt`);
}

function downloadDaily(){
  let today = new Date().toLocaleDateString();
  let text = `BAZRO DAILY SALES ${today}\n================\n`;
  let grand = 0;

  sales.filter(s => s.date.includes(today)).forEach((s,n)=>{
    let total = 0;
    text += `\nSale ${n+1} - ${s.date}\n`;
    s.items.forEach(i=>{
      let l = i.price * i.qty;
      total += l;
      text += `${i.qty}x ${i.name} £${l.toFixed(2)}\n`;
    });
    text += `Subtotal £${total.toFixed(2)}\n`;
    grand += total;
  });

  text += `\nGRAND TOTAL £${grand.toFixed(2)}`;
  download(text, `daily_${today.replace(/\//g,'-')}.txt`);
}

function download(text,name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text],{type:"text/plain"}));
  a.download = name;
  a.click();
}
</script>

</body>
</html>
