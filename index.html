<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bazro POS v2</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #2a5298; --bg: #f4f7f6; --card-bg: #ffffff; --text: #333; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); padding-bottom: 50px; }
        header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; text-align: center; padding: 20px; font-weight: 800; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        .btn-scan { background: #00b894; }
        .btn-stop { background: #d63031; display: none; }
        .btn-download { background: #fdcb6e; color: black; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin: 10px 0; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .total-section { margin-top: 15px; font-weight: bold; font-size: 18px; color: var(--primary); text-align: right; }
        footer { text-align: center; color: #888; font-size: 11px; margin-top: 20px; }
    </style>
</head>
<body>

<header>BAZRO POS v2</header>

<div class="container">
    <div class="card">
        <h2>Manage Inventory</h2>
        <input id="barcode" placeholder="Barcode ID">
        <input id="name" placeholder="Product Name">
        <input id="price" type="number" step="0.01" placeholder="Price (£)">
        <input id="stock" type="number" placeholder="Stock">
        <button onclick="addProduct()">Save Product</button>
    </div>

    <div class="card">
        <h2>Sales Counter</h2>
        <div id="reader"></div>
        <button id="startBtn" class="btn-scan" onclick="startContinuousScanner()">📷 Start Continuous Scan</button>
        <button id="stopBtn" class="btn-stop" onclick="stopScanner()">🛑 Stop Scanner</button>
        
        <input id="sellBarcode" placeholder="Manual Barcode Entry">
        <button onclick="addToCart()">Add Manually</button>

        <h3>Basket</h3>
        <div id="cartList"></div>
        <div class="total-section" id="total">Total: £0.00</div>
        
        <button style="background: #27ae60; margin-top: 15px;" onclick="checkout()">Checkout (Alert)</button>
        <button class="btn-download" onclick="downloadReceipt()">📥 Download Receipt (.txt)</button>
    </div>
</div>

<footer>Designed by Yamin</footer>

<script>
    let products = JSON.parse(localStorage.getItem("products")) || {};
    let cart = []; // Array of {barcode, name, price, qty}
    let html5QrCode;
    let lastScannedCode = "";
    let lastScannedTime = 0;

    function addProduct() {
        const b = document.getElementById('barcode').value;
        const n = document.getElementById('name').value;
        const p = document.getElementById('price').value;
        const s = document.getElementById('stock').value;
        if(!b || !n || !p) return alert("Fill required fields");

        products[b] = { name: n, price: parseFloat(p), stock: parseInt(s) || 0 };
        localStorage.setItem("products", JSON.stringify(products));
        alert("Saved!");
        ['barcode','name','price','stock'].forEach(id => document.getElementById(id).value="");
    }

    function addToCart(manualCode = null) {
        const b = manualCode || document.getElementById('sellBarcode').value;
        const p = products[b];

        if(!p) {
            if(!manualCode) alert("Not in inventory");
            return;
        }
        if(p.stock <= 0) return alert("Out of stock!");

        // Quantity Logic: Find if item exists in cart
        let item = cart.find(i => i.barcode === b);
        if(item) {
            item.qty++;
        } else {
            cart.push({ barcode: b, name: p.name, price: p.price, qty: 1 });
        }

        p.stock--;
        updateUI();
        localStorage.setItem("products", JSON.stringify(products));
        document.getElementById('sellBarcode').value = "";
    }

    function updateUI() {
        const list = document.getElementById("cartList");
        let total = 0;
        list.innerHTML = cart.map(item => {
            const lineTotal = item.price * item.qty;
            total += lineTotal;
            return `<div class="cart-item">
                <span>${item.qty}x ${item.name}</span>
                <span>£${lineTotal.toFixed(2)}</span>
            </div>`;
        }).join('');
        document.getElementById("total").innerText = `Total: £${total.toFixed(2)}`;
    }

    // CONTINUOUS SCANNER LOGIC
    function startContinuousScanner() {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                const now = Date.now();
                // Prevent duplicate scans within 2 seconds
                if(decodedText !== lastScannedCode || (now - lastScannedTime > 2000)) {
                    lastScannedCode = decodedText;
                    lastScannedTime = now;
                    addToCart(decodedText);
                    // Simple "beep" sound using browser vibrator
                    if(navigator.vibrate) navigator.vibrate(100);
                }
            }
        ).catch(err => alert("Camera error. Use HTTPS."));
    }

    function stopScanner() {
        if(html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('stopBtn').style.display = 'none';
            });
        }
    }

    function downloadReceipt() {
        if(cart.length === 0) return alert("Empty basket");
        
        let total = 0;
        let text = "BAZRO POS RECEIPT\n" + new Date().toLocaleString() + "\n";
        text += "--------------------------------\n";
        cart.forEach(item => {
            const lineTotal = item.price * item.qty;
            total += lineTotal;
            text += `${item.qty}x ${item.name.padEnd(15)} £${lineTotal.toFixed(2)}\n`;
        });
        text += "--------------------------------\n";
        text += `TOTAL: £${total.toFixed(2)}\n\nThank you!`;

        const blob = new Blob([text], { type: "text/plain" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Receipt_${Date.now()}.txt`;
        link.click();
    }

    function checkout() {
        if(cart.length === 0) return alert("Empty basket");
        alert("Transaction Recorded. Please use Download Receipt for a copy.");
        cart = [];
        updateUI();
    }
</script>
</body>
</html>
