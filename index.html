<script>

async function downloadLuxuryInvoice() {

    const items = cart.length ? cart : (sales[0]?.items || []);
    if (!items.length) return notify("No items to invoice", "red");

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');

    const invoiceNumber = `2026-${Date.now().toString().slice(-3)}`;
    const today = new Date();
    const dateStr = today.toLocaleDateString("en-GB");

    let startY = 20;

    // =========================
    // COMPANY HEADER
    // =========================
    doc.setFont("helvetica", "bold");
    doc.setFontSize(20);
    doc.text("Bazro", 20, startY);

    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text("9a Commercial Square - Camborne - TR14 8AT", 20, startY + 6);
    doc.text("Co. Reg. No.: 15649986", 20, startY + 12);
    doc.text("Email: bazro@webnest.co.uk | Phone: +447534100986", 20, startY + 18);
    doc.text("Website: www.bazro.co.uk", 20, startY + 24);

    // =========================
    // INVOICE INFO (RIGHT SIDE)
    // =========================
    doc.setFont("helvetica", "bold");
    doc.text(`Invoice: ${invoiceNumber}`, 140, startY);
    doc.setFont("helvetica", "normal");
    doc.text(`Invoice Date: ${dateStr}`, 140, startY + 8);
    doc.text(`Due Date: ${dateStr}`, 140, startY + 16);
    doc.text(`Customer No.: 1`, 140, startY + 24);

    // =========================
    // BILL TO
    // =========================
    let billY = startY + 40;

    doc.setFont("helvetica", "bold");
    doc.text("Bill To:", 20, billY);

    doc.setFont("helvetica", "normal");
    doc.text("Customer", 20, billY + 8);
    doc.text("United Kingdom", 20, billY + 16);

    // =========================
    // TABLE HEADER
    // =========================
    let tableY = billY + 30;

    doc.setFont("helvetica", "bold");
    doc.text("Description", 20, tableY);
    doc.text("Quantity", 110, tableY);
    doc.text("Unit Price", 135, tableY);
    doc.text("VAT", 165, tableY);
    doc.text("Amount", 180, tableY);

    doc.line(20, tableY + 2, 200, tableY + 2);

    tableY += 10;

    doc.setFont("helvetica", "normal");

    let subtotal = 0;
    let vat20 = 0;
    let vat0 = 0;

    items.forEach(item => {

        const qty = item.qty;
        const unit = item.price;
        const amount = qty * unit;

        // Simple VAT rule: if price has decimals assume 20% VAT (you can adjust)
        const vatRate = 0.20;
        const vatAmount = amount * vatRate;

        subtotal += amount;
        vat20 += vatAmount;

        doc.text(item.name.substring(0, 35), 20, tableY);
        doc.text(qty.toString(), 115, tableY);
        doc.text(`£${unit.toFixed(2)}`, 135, tableY);
        doc.text("20%", 168, tableY);
        doc.text(`£${amount.toFixed(2)}`, 180, tableY);

        tableY += 8;

        if (tableY > 260) {
            doc.addPage();
            tableY = 20;
        }

    });

    const total = subtotal + vat20;

    tableY += 10;
    doc.line(120, tableY, 200, tableY);

    tableY += 8;

    doc.setFont("helvetica", "bold");
    doc.text("Subtotal without VAT", 120, tableY);
    doc.text(`£${subtotal.toFixed(2)}`, 180, tableY);

    tableY += 8;
    doc.text("VAT 20%", 120, tableY);
    doc.text(`£${vat20.toFixed(2)}`, 180, tableY);

    tableY += 8;
    doc.setFontSize(13);
    doc.text("Total GBP", 120, tableY);
    doc.text(`£${total.toFixed(2)}`, 180, tableY);

    tableY += 15;

    doc.setFontSize(11);
    doc.setFont("helvetica", "normal");
    doc.text("Payment Instructions:", 20, tableY);
    tableY += 8;

    doc.text("Bank Transfer", 20, tableY);
    tableY += 6;
    doc.text("Account Name: GKIDEAS LIMITED", 20, tableY);
    tableY += 6;
    doc.text("Sort Code: 54-30-37", 20, tableY);
    tableY += 6;
    doc.text("Account Number: 39640965", 20, tableY);

    doc.save(`Invoice_${invoiceNumber}.pdf`);

    notify("Invoice Downloaded", "var(--green)");
}

</script>
