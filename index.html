<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS - Ultra Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    :root { --orange: #ff512f; --yellow: #f09819; --dark: #141e30; --green: #27ae60; --red: #e74c3c; --gold: #D4AF37; --slate: #243b55; }
    
    body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; padding-bottom: 100px; color: #333; overflow-x: hidden; }
    
    /* Luxury Header */
    header { background: linear-gradient(135deg, var(--dark), var(--slate)); padding: 20px; text-align: center; color: white; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    header h1 { margin: 0; font-size: 28px; letter-spacing: 4px; font-weight: 900; color: var(--gold); }
    header p { margin: 5px 0 0; font-size: 10px; opacity: 0.8; letter-spacing: 1px; }

    .container { max-width: 500px; margin: auto; padding: 15px; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .active-page { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Cards & UI */
    .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); }
    h3 { margin-top: 0; color: var(--dark); font-size: 18px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    
    input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; background: #fdfdfd; }
    input:focus { border-color: var(--gold); outline: none; background: #fff; }
    
    button { width: 100%; padding: 16px; margin: 8px 0; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--orange), var(--yellow)); color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.97); }
    
    .btn-sec { background: var(--slate); }
    .btn-pdf { background: #1a1a1a; border: 1px solid var(--gold); color: var(--gold); }
    .btn-qr { background: var(--gold); color: #000; }
    .btn-danger { background: var(--red); font-size: 12px; padding: 10px; width: auto; }

    /* Scanner View */
    #scanner-wrap { background: #000; border-radius: 20px; display: none; margin-bottom: 20px; padding: 10px; position: relative; overflow: hidden; }
    #reader { width: 100%; border-radius: 15px; overflow: hidden; }
    #flash-btn { position: absolute; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; z-index: 10; padding: 0; display: none; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); font-size: 24px; }

    /* Basket Table */
    .row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f1f1f1; align-items: center; }
    .qty-ctrl { display: flex; align-items: center; gap: 15px; background: #f1f3f5; padding: 5px 12px; border-radius: 30px; }
    .q-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--dark); color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; border: none; cursor: pointer; }
    
    /* Stock List Table */
    .stock-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .stock-table th { text-align: left; padding: 10px; color: #888; border-bottom: 1px solid #eee; }
    .stock-table td { padding: 12px 10px; border-bottom: 1px solid #f9f9f9; }
    .low-stock { color: var(--red); font-weight: bold; }

    /* Nav Bar */
    nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; height: 80px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 1000; }
    nav button { flex: 1; background: none; color: #adb5bd; border-top: 4px solid transparent; border-radius: 0; margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    nav button.active-nav { color: var(--orange); border-top-color: var(--orange); }

    /* Overlays */
    #qr-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10001; display: none; align-items: center; justify-content: center; flex-direction: column; color: white; }
    #qr-box { background: white; padding: 20px; border-radius: 20px; margin: 20px; }

    #status-msg { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); padding: 12px 35px; border-radius: 50px; color: white; font-weight: 600; z-index: 9999; opacity: 0; transition: 0.4s; pointer-events: none; }
</style>
</head>
<body>

<div id="status-msg"></div>

<header>
    <h1>BAZRO</h1>
    <p>PREMIUM GROCERY • CAMBORNE</p>
</header>

<div id="qr-overlay" onclick="this.style.display='none'">
    <h2 style="color:var(--gold)">INVOICE READY</h2>
    <div id="qr-box"></div>
    <p>Customer can scan to download</p>
    <button style="width:150px" onclick="document.getElementById('qr-overlay').style.display='none'">CLOSE</button>
</div>

<div class="container">
    <div id="scanner-wrap">
        <div id="reader"></div>
        <button id="flash-btn" onclick="toggleFlash()">🔦</button>
        <button class="btn-stop" onclick="stopScan()" style="margin-top:10px">CLOSE SCANNER</button>
    </div>

    <div id="page-sales" class="page active-page">
        <div class="card">
            <h3>Checkout <span style="font-size:12px; color:var(--gold)">Scanner Active</span></h3>
            <button onclick="startScan('sell')">📷 SCAN ITEM TO ADD</button>
            <input id="sell_barcode" placeholder="Manual Barcode Entry">
            <button class="btn-sec" onclick="addToCart()">ADD MANUALLY</button>
        </div>
        <div class="card">
            <h3>Basket</h3>
            <div id="cart-list"></div>
            <div style="text-align:right; font-weight:800; font-size:26px; margin:20px 0; color:var(--dark)" id="cart-total">Total: £0.00</div>
            <button style="background:var(--green)" onclick="checkout()">COMPLETE SALE</button>
            <button class="btn-qr" onclick="generateQR(null)">📱 CUSTOMER SCAN (QR)</button>
            <button class="btn-pdf" onclick="downloadInvoice(null)">📄 DOWNLOAD PDF</button>
        </div>
    </div>

    <div id="page-history" class="page">
        <div class="card">
            <h3>Sales History</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <div id="page-stock" class="page">
        <div class="card">
            <h3>Product Entry</h3>
            <button onclick="startScan('add')">📷 SCAN BARCODE</button>
            <input id="p_barcode" placeholder="Barcode ID">
            <input id="p_name" placeholder="Product Name">
            <input id="p_price" type="number" step="0.01" placeholder="Price (£)">
            <input id="p_stock" type="number" placeholder="Quantity Available">
            <button onclick="addProduct()">SAVE TO STOCK</button>
        </div>
        <div class="card">
            <h3>Quantity Available</h3>
            <table class="stock-table">
                <thead><tr><th>Item</th><th>Price</th><th>Stock</th></tr></thead>
                <tbody id="stock-inventory-list"></tbody>
            </table>
        </div>
        <div class="card">
            <h3>Data Management</h3>
            <button class="btn-sec" onclick="exportDB()">💾 EXPORT BACKUP</button>
            <button class="btn-sec" onclick="document.getElementById('importFile').click()">📂 IMPORT BACKUP</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importDB(event)">
        </div>
    </div>

    <div id="page-report" class="page">
        <div class="card">
            <h3>End of Day Report</h3>
            <input type="date" id="report_date">
            <input type="number" id="cash_sales" placeholder="Total Cash Sales (£)">
            <input type="number" id="card_sales" placeholder="Total Card Sales (£)">
            <input type="number" id="expenses" placeholder="Total Expenses (£)">
            <button onclick="saveReport()">GENERATE REPORT</button>
        </div>
    </div>
</div>

<nav>
    <button id="nav-sales" class="active-nav" onclick="showPage('sales')">SHOP</button>
    <button id="nav-history" onclick="showPage('history')">HISTORY</button>
    <button id="nav-stock" onclick="showPage('stock')">STOCK</button>
    <button id="nav-report" onclick="showPage('report')">REPORT</button>
</nav>

<script>
// --- CORE DATA ---
let products = JSON.parse(localStorage.getItem("bazro_products") || "{}");
let sales = JSON.parse(localStorage.getItem("bazro_sales") || "[]");
let cart = [];
let html5QrCode = null;
let scanPaused = false;
let isFlashOn = false;

const INFO = {
    name: "BAZRO",
    address: "9a Commercial St, Camborne TR14 8AT",
    phone: "07534 100986"
};

// --- NAVIGATION ---
function showPage(p) {
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
    document.getElementById('page-'+p).classList.add('active-page');
    document.getElementById('nav-'+p).classList.add('active-nav');
    if(p === 'history') renderHistory();
    if(p === 'stock') renderStockList();
    stopScan();
}

function notify(msg, color) {
    const el = document.getElementById("status-msg");
    el.innerText = msg; el.style.background = color; el.style.opacity = "1";
    setTimeout(() => el.style.opacity = "0", 2500);
}

// --- SCANNER SYSTEM (A-Z FIXED) ---
async function startScan(mode) {
    if (html5QrCode) { try { await html5QrCode.stop(); } catch(e) {} }
    document.getElementById("reader").innerHTML = "";
    document.getElementById("scanner-wrap").style.display = "block";
    html5QrCode = new Html5Qrcode("reader");

    try {
        await html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (code) => {
            if (scanPaused) return;
            if (mode === 'add') {
                document.getElementById("p_barcode").value = code;
                stopScan();
                notify("Barcode Caught!", "var(--green)");
            } else {
                if (!products[code]) { notify("Unknown Item", "red"); return; }
                scanPaused = true;
                addToCart(code);
                notify(products[code].name + " Added", "var(--green)");
                setTimeout(() => { scanPaused = false; }, 2000); // 2 SECONDS AUTO-PAUSE
            }
        });
        setTimeout(() => {
            const track = html5QrCode.getRunningTrackCapabilities();
            if(track.torch) document.getElementById("flash-btn").style.display = "block";
        }, 1000);
    } catch (err) { notify("Camera Error", "red"); }
}

async function stopScan() {
    if (html5QrCode) { await html5QrCode.stop(); html5QrCode.clear(); }
    document.getElementById("scanner-wrap").style.display = "none";
    isFlashOn = false;
}

async function toggleFlash() {
    isFlashOn = !isFlashOn;
    await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isFlashOn }] });
}

// --- SHOP & BASKET ---
function addToCart(manualCode = null) {
    const b = (manualCode || document.getElementById("sell_barcode").value).trim();
    if (!products[b]) return notify("Item not in stock", "red");
    
    let item = cart.find(i => i.barcode === b);
    if (item) {
        item.qty++;
    } else {
        cart.push({ barcode: b, name: products[b].name, price: products[b].price, qty: 1 });
    }
    renderCart();
    document.getElementById("sell_barcode").value = "";
}

function updateQty(barcode, change) {
    let item = cart.find(i => i.barcode === barcode);
    if (!item) return;
    item.qty += change;
    if (item.qty <= 0) cart = cart.filter(i => i.barcode !== barcode);
    renderCart();
}

function renderCart() {
    let t = 0;
    const list = document.getElementById("cart-list");
    list.innerHTML = cart.map(i => {
        t += i.qty * i.price;
        return `<div class="row">
            <div style="flex:1"><b>${i.name}</b><br><small>£${i.price.toFixed(2)}</small></div>
            <div class="qty-ctrl">
                <button class="q-btn" onclick="updateQty('${i.barcode}', -1)">-</button>
                <span>${i.qty}</span>
                <button class="q-btn" onclick="updateQty('${i.barcode}', 1)">+</button>
            </div>
            <div style="width:70px; text-align:right; font-weight:bold;">£${(i.qty * i.price).toFixed(2)}</div>
        </div>`;
    }).join("");
    document.getElementById("cart-total").innerText = `Total: £${t.toFixed(2)}`;
}

function checkout() {
    if(!cart.length) return;
    // Deduct stock
    cart.forEach(item => {
        if(products[item.barcode]) {
            products[item.barcode].stock = Math.max(0, products[item.barcode].stock - item.qty);
        }
    });
    localStorage.setItem("bazro_products", JSON.stringify(products));
    
    sales.unshift({ id: Date.now(), time: new Date().toLocaleString(), items: [...cart] });
    localStorage.setItem("bazro_sales", JSON.stringify(sales));
    notify("Transaction Complete", "var(--green)");
    cart = []; renderCart();
}

// --- LUXURY INVOICE & QR ---
function buildPDF(idx) {
    const items = (idx === null) ? cart : sales[idx].items;
    if(!items.length) return null;
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', [80, 200]); // Receipt format

    doc.setFillColor(20, 30, 53); // Dark background
    doc.rect(0, 0, 80, 30, 'F');
    
    doc.setTextColor(212, 175, 55); // Gold
    doc.setFontSize(22);
    doc.text(INFO.name, 40, 15, { align: 'center' });
    
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(7);
    doc.text(INFO.address, 40, 20, { align: 'center' });
    doc.text(INFO.phone, 40, 24, { align: 'center' });

    doc.setTextColor(0,0,0);
    doc.setFontSize(9);
    doc.text("--------------------------------------------------", 40, 35, { align: 'center' });
    doc.text(`DATE: ${new Date().toLocaleString()}`, 10, 42);
    
    let y = 52;
    let total = 0;
    items.forEach(i => {
        let sub = i.qty * i.price;
        total += sub;
        doc.text(`${i.name.substring(0,20)} x${i.qty}`, 10, y);
        doc.text(`£${sub.toFixed(2)}`, 70, y, { align: 'right' });
        y += 7;
    });
    
    doc.line(10, y, 70, y);
    doc.setFontSize(12);
    doc.setFont("helvetica", "bold");
    doc.text(`TOTAL: £${total.toFixed(2)}`, 70, y + 10, { align: 'right' });
    
    doc.setFontSize(8);
    doc.setFont("helvetica", "italic");
    doc.text("Thank you for shopping at Bazro", 40, y + 25, { align: 'center' });
    
    return doc;
}

function downloadInvoice(idx) {
    const doc = buildPDF(idx);
    if(doc) doc.save(`Bazro_Invoice.pdf`);
}

function generateQR(idx) {
    const doc = buildPDF(idx);
    if(!doc) return notify("No items", "orange");
    const base64 = doc.output('datauristring');
    document.getElementById("qr-box").innerHTML = "";
    new QRCode(document.getElementById("qr-box"), { text: base64, width: 250, height: 250 });
    document.getElementById("qr-overlay").style.display = "flex";
}

// --- HISTORY & STOCK MANAGEMENT ---
function renderHistory() {
    const cont = document.getElementById("history-list");
    if(!sales.length) { cont.innerHTML = "No sales recorded."; return; }
    cont.innerHTML = sales.map((s, idx) => {
        let stotal = s.items.reduce((acc, i) => acc + (i.qty * i.price), 0);
        return `<div class="card" style="padding:15px; border-left: 4px solid var(--gold)">
            <div style="font-size:13px"><b>${s.time}</b> | Total: £${stotal.toFixed(2)}</div>
            <div style="display:flex; gap:10px; margin-top:10px">
                <button class="btn-pdf" style="padding:8px; font-size:11px" onclick="downloadInvoice(${idx})">PDF</button>
                <button class="btn-qr" style="padding:8px; font-size:11px" onclick="generateQR(${idx})">QR</button>
                <button class="btn-danger" style="color:white" onclick="deleteSale(${idx})">DEL</button>
            </div>
        </div>`;
    }).join("");
}

function deleteSale(idx) {
    if(confirm("Delete this record?")) {
        sales.splice(idx, 1);
        localStorage.setItem("bazro_sales", JSON.stringify(sales));
        renderHistory();
    }
}

function addProduct() {
    const b = document.getElementById("p_barcode").value, n = document.getElementById("p_name").value, p = document.getElementById("p_price").value, s = document.getElementById("p_stock").value;
    if(!b || !n || !p) return notify("Fill required fields", "red");
    
    products[b] = { name: n, price: Number(p), stock: Number(s || 0) };
    localStorage.setItem("bazro_products", JSON.stringify(products));
    notify(n + " Saved", "var(--green)");
    renderStockList();
    ["p_barcode", "p_name", "p_price", "p_stock"].forEach(id => document.getElementById(id).value = "");
}

function renderStockList() {
    const list = document.getElementById("stock-inventory-list");
    const items = Object.entries(products);
    list.innerHTML = items.map(([code, p]) => `
        <tr>
            <td>${p.name}</td>
            <td>£${p.price.toFixed(2)}</td>
            <td class="${p.stock < 5 ? 'low-stock' : ''}">${p.stock}</td>
        </tr>
    `).join("");
}

// --- DATABASE TOOLS ---
function exportDB() {
    const data = JSON.stringify({ products, sales });
    const blob = new Blob([data], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Bazro_Backup_${new Date().toLocaleDateString()}.json`;
    a.click();
}

function importDB(e) {
    const reader = new FileReader();
    reader.onload = (event) => {
        const data = JSON.parse(event.target.result);
        products = data.products || {};
        sales = data.sales || [];
        localStorage.setItem("bazro_products", JSON.stringify(products));
        localStorage.setItem("bazro_sales", JSON.stringify(sales));
        location.reload();
    };
    reader.readAsText(e.target.files[0]);
}

// --- INITIALIZE ---
window.onload = () => {
    renderStockList();
};

</script>
</body>
</html>
