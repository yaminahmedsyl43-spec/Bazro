<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root{
  --p1:#ff512f;
  --p2:#f09819;
  --dark:#1f2937;
}
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:linear-gradient(135deg,#141e30,#243b55);
}
header{
  background:linear-gradient(135deg,var(--p1),var(--p2));
  padding:16px;
  text-align:center;
  color:white;
  font-size:22px;
  font-weight:800;
}
.container{max-width:520px;margin:auto;padding:15px}
.card{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);
}
input,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:12px;
  border:1px solid #ddd;
}
button{
  border:none;
  background:linear-gradient(135deg,var(--p1),var(--p2));
  color:white;
  font-weight:700;
}
button.alt{background:#374151}
#reader{margin-top:10px}
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0;
}
.qty{display:flex;gap:6px;align-items:center}
.qty button{
  width:32px;
  padding:6px;
  background:#e5e7eb;
  color:#111;
  font-weight:800;
}
.total{
  text-align:right;
  font-size:18px;
  font-weight:800;
  margin-top:10px;
}
</style>
</head>

<body>

<header>BAZRO POS</header>

<div class="container">

<!-- ADD PRODUCT -->
<div class="card">
<h3>Add Product</h3>
<div id="reader"></div>

<button onclick="startScan('add')">📷 Scan Barcode</button>
<button onclick="toggleTorch()">🔦 Torch</button>

<input id="p_barcode" placeholder="Barcode">
<input id="p_name" placeholder="Product name">
<input id="p_price" type="number" step="0.01" placeholder="Price">
<input id="p_stock" type="number" placeholder="Stock">

<button onclick="addProduct()">Save Product</button>
</div>

<!-- SELL -->
<div class="card">
<h3>Sell</h3>
<button onclick="startScan('sell')">📷 Scan to Sell</button>

<input id="sell_barcode" placeholder="Manual barcode">
<button onclick="addToCart()">Add to Cart</button>

<div id="cart"></div>
<div class="total" id="total">Total: £0.00</div>

<button onclick="checkout()">Checkout</button>
<button class="alt" onclick="openInvoice()">🧾 View Invoice</button>
</div>

</div>

<script>
/* ===== DATA ===== */
let products = JSON.parse(localStorage.getItem("products")||"{}");
let sales = JSON.parse(localStorage.getItem("sales")||"[]");
let cart = [];

/* ===== SCANNER ===== */
const qr = new Html5Qrcode("reader");
let scanMode="add";
let torchOn=false;

function startScan(mode){
  scanMode=mode;
  qr.stop().catch(()=>{});
  qr.start(
    {facingMode:"environment"},
    {fps:10,qrbox:250},
    code=>{
      if(scanMode==="add"){
        p_barcode.value=code;
      }else{
        addToCart(code);
      }
      qr.stop().catch(()=>{});
    }
  ).catch(()=>alert("Use HTTPS + Android Chrome for camera"));
}

/* ===== TORCH ===== */
async function toggleTorch(){
  try{
    const track = qr.getRunningTrack();
    if(!track) return alert("Start scanner first");
    torchOn=!torchOn;
    await track.applyConstraints({advanced:[{torch:torchOn}]});
  }catch{
    alert("Torch not supported on this device");
  }
}

/* ===== ADD PRODUCT ===== */
function addProduct(){
  const b=p_barcode.value.trim();
  const n=p_name.value.trim();
  const p=p_price.value;
  const s=p_stock.value||0;

  if(!b||!n||p===""){
    alert("Barcode, name, price required");
    return;
  }

  products[b]={name:n,price:Number(p),stock:Number(s)};
  localStorage.setItem("products",JSON.stringify(products));

  p_barcode.value=p_name.value=p_price.value=p_stock.value="";
  alert("Product saved");
}

/* ===== CART ===== */
function addToCart(code=null){
  const b=(code||sell_barcode.value).trim();
  if(!products[b]) return alert("Product not found");
  if(products[b].stock<=0) return alert("Out of stock");

  let i=cart.find(x=>x.barcode===b);
  if(i) i.qty++;
  else cart.push({barcode:b,name:products[b].name,price:products[b].price,qty:1});

  products[b].stock--;
  localStorage.setItem("products",JSON.stringify(products));
  sell_barcode.value="";
  renderCart();
}

function changeQty(b,d){
  let i=cart.find(x=>x.barcode===b);
  if(!i) return;
  if(d>0 && products[b].stock<=0) return;

  i.qty+=d;
  products[b].stock-=d;
  if(i.qty<=0) cart=cart.filter(x=>x.barcode!==b);

  localStorage.setItem("products",JSON.stringify(products));
  renderCart();
}

function renderCart(){
  let t=0;
  cart.innerHTML=cart.map(i=>{
    let l=i.qty*i.price; t+=l;
    return `
    <div class="cart-item">
      <span><strong>${i.name}</strong><br>£${i.price.toFixed(2)}</span>
      <div class="qty">
        <button onclick="changeQty('${i.barcode}',-1)">−</button>
        <strong>${i.qty}</strong>
        <button onclick="changeQty('${i.barcode}',1)">+</button>
      </div>
      <strong>£${l.toFixed(2)}</strong>
    </div>`;
  }).join("");
  total.innerText=`Total: £${t.toFixed(2)}`;
}

/* ===== CHECKOUT ===== */
function checkout(){
  if(!cart.length) return alert("Cart empty");
  sales.push({date:new Date().toLocaleString(),items:[...cart]});
  localStorage.setItem("sales",JSON.stringify(sales));
  cart=[];
  renderCart();
  alert("Sale saved");
}

/* ===== INVOICE ===== */
function openInvoice(){
  if(!sales.length) return alert("No sales");
  const s=sales[sales.length-1];

  let rows="",total=0;
  s.items.forEach(i=>{
    let l=i.qty*i.price; total+=l;
    rows+=`<tr><td>${i.name}</td><td>${i.qty}</td><td>£${l.toFixed(2)}</td></tr>`;
  });

  const w=window.open("","invoice");
  w.document.write(`
  <html><head><title>Invoice</title>
  <style>
  body{font-family:Arial;background:#f9fafb;padding:20px}
  .inv{max-width:500px;margin:auto;background:white;padding:20px;border-radius:12px}
  h1{color:#ff512f;text-align:center}
  table{width:100%;border-collapse:collapse}
  td{padding:8px;border-bottom:1px solid #eee}
  .t{font-weight:800;text-align:right}
  </style></head>
  <body>
  <div class="inv">
  <h1>BAZRO</h1>
  <p>${s.date}</p>
  <table>${rows}</table>
  <p class="t">TOTAL £${total.toFixed(2)}</p>
  </div>
  </body></html>`);
  w.print();
}
</script>

</body>
</html>
