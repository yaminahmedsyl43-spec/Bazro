<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS - Invoice Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    :root { --orange: #ff512f; --yellow: #f09819; --dark: #141e30; }
    body {
        margin: 0; font-family: 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, var(--dark), #243b55);
        color: #333; padding-bottom: 50px;
    }
    header {
        background: linear-gradient(135deg, var(--orange), var(--yellow));
        padding: 20px; text-align: center; color: white;
        font-size: 24px; font-weight: 800; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .container { max-width: 500px; margin: auto; padding: 15px; }
    .card {
        background: white; border-radius: 16px; padding: 20px;
        margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h3 { margin: 0 0 15px 0; color: var(--dark); border-bottom: 2px solid #eee; padding-bottom: 5px; }
    input {
        width: 100%; padding: 12px; margin: 8px 0;
        border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box;
    }
    button {
        width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px;
        border: none; background: linear-gradient(135deg, var(--orange), var(--yellow));
        color: white; font-weight: bold; font-size: 16px; cursor: pointer;
    }
    button:active { transform: scale(0.98); opacity: 0.9; }
    .btn-sec { background: #444; }
    .btn-pdf { background: #2980b9; }
    .btn-stop { background: #d63031; margin-top: 10px; }
    
    #scanner-box { display: none; text-align: center; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
    
    .cart-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 0; border-bottom: 1px solid #eee;
    }
    .qty-controls { display: flex; gap: 10px; align-items: center; }
    .qty-btn { width: 35px; height: 35px; padding: 0; background: #f0f0f0; color: #333; border: 1px solid #ccc; }
    
    .total-area { text-align: right; font-size: 22px; font-weight: 800; margin: 20px 0; color: var(--orange); }
    
    #status-msg {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        padding: 12px 25px; border-radius: 30px; color: white;
        font-weight: bold; z-index: 9999; opacity: 0; transition: 0.3s; pointer-events: none;
    }
</style>
</head>

<body>

<div id="status-msg"></div>
<header>BAZRO POS</header>

<div class="container">
    <div id="scanner-box" class="card">
        <div id="reader"></div>
        <button class="btn-stop" onclick="stopScan()">Close Camera</button>
    </div>

    <div class="card">
        <h3>Add to Inventory</h3>
        <button onclick="startScan('add')">📷 Scan Barcode</button>
        <input id="p_barcode" placeholder="Barcode ID">
        <input id="p_name" placeholder="Product Name">
        <input id="p_price" type="number" step="0.01" placeholder="Price (£)">
        <input id="p_stock" type="number" placeholder="Current Stock">
        <button onclick="addProduct()">Save Product</button>
    </div>

    <div class="card">
        <h3>Checkout Counter</h3>
        <button onclick="startScan('sell')">📷 Continuous Scan</button>
        <input id="sell_barcode" placeholder="Manual Entry">
        <button class="btn-sec" onclick="addToCart()">Add Manually</button>

        <div id="cart-display"></div>
        <div class="total-area" id="grand-total">Total: £0.00</div>

        <button style="background:#27ae60" onclick="checkout()">Complete Sale</button>
        <button class="btn-pdf" onclick="generatePDF()">📥 Share Bazro Invoice</button>
        <button class="btn-sec" onclick="downloadDaily()">Daily Report (.txt)</button>
    </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem("products") || "{}");
let sales = JSON.parse(localStorage.getItem("sales") || "[]");
let cart = [];
let qrScanner = null;
let scanPaused = false;

function notify(msg, color) {
    const el = document.getElementById("status-msg");
    el.innerText = msg; el.style.background = color; el.style.opacity = "1";
    setTimeout(() => { el.style.opacity = "0"; }, 2000);
}

async function startScan(mode) {
    document.getElementById("scanner-box").style.display = "block";
    if (!qrScanner) qrScanner = new Html5Qrcode("reader");
    try {
        await qrScanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (code) => {
            if (scanPaused) return;
            if (mode === "add") { document.getElementById("p_barcode").value = code; stopScan(); }
            else { handleAutoScan(code); }
        });
    } catch (err) { notify("Camera Error", "red"); }
}

function handleAutoScan(code) {
    const b = code.trim();
    if (!products[b]) { notify("Unknown Barcode", "#444"); return; }
    scanPaused = true;
    addToCart(b);
    notify("Added: " + products[b].name, "#27ae60");
    if(navigator.vibrate) navigator.vibrate(60);
    setTimeout(() => { scanPaused = false; }, 1800);
}

async function stopScan() {
    if (qrScanner) { await qrScanner.stop(); document.getElementById("scanner-box").style.display = "none"; scanPaused = false; }
}

function addProduct() {
    const b = document.getElementById("p_barcode").value.trim(), n = document.getElementById("p_name").value.trim(), p = document.getElementById("p_price").value, s = document.getElementById("p_stock").value || 0;
    if (!b || !n || !p) return notify("Missing Info!", "red");
    products[b] = { name: n, price: Number(p), stock: Number(s) };
    localStorage.setItem("products", JSON.stringify(products));
    notify("Saved to Database", "blue");
    document.querySelectorAll(".card:nth-child(2) input").forEach(i => i.value = "");
}

function addToCart(manualCode = null) {
    const b = (manualCode || document.getElementById("sell_barcode").value).trim();
    if (!b) return;
    const prod = products[b];
    if (!prod) { if(!manualCode) notify("Not Found", "red"); return; }
    if (prod.stock <= 0) return notify("Out of Stock", "orange");
    let item = cart.find(i => i.barcode === b);
    if (item) { item.qty++; } else { cart.push({ barcode: b, name: prod.name, price: prod.price, qty: 1 }); }
    prod.stock--;
    localStorage.setItem("products", JSON.stringify(products));
    document.getElementById("sell_barcode").value = "";
    renderCart();
}

function updateQty(b, amt) {
    let item = cart.find(i => i.barcode === b);
    if (!item) return;
    if (amt > 0) { if (products[b].stock <= 0) return notify("No Stock Left", "orange"); item.qty++; products[b].stock--; }
    else { item.qty--; products[b].stock++; if (item.qty <= 0) cart = cart.filter(i => i.barcode !== b); }
    localStorage.setItem("products", JSON.stringify(products));
    renderCart();
}

function renderCart() {
    let total = 0;
    const div = document.getElementById("cart-display");
    div.innerHTML = cart.map(i => {
        const line = i.qty * i.price; total += line;
        return `<div class="cart-item"><span><strong>${i.name}</strong><br>£${i.price.toFixed(2)}</span><div class="qty-controls"><button class="qty-btn" onclick="updateQty('${i.barcode}',-1)">-</button><strong>${i.qty}</strong><button class="qty-btn" onclick="updateQty('${i.barcode}',1)">+</button></div><strong>£${line.toFixed(2)}</strong></div>`;
    }).join("");
    document.getElementById("grand-total").innerText = `Total: £${total.toFixed(2)}`;
}

function checkout() {
    if (!cart.length) return notify("Cart is empty", "red");
    sales.push({ date: new Date().toLocaleString(), items: [...cart] });
    localStorage.setItem("sales", JSON.stringify(sales));
    notify("SALE RECORDED", "#27ae60");
}

/* --- PDF GENERATION & SHARING --- */
async function generatePDF() {
    if (!cart.length) return notify("No items to print", "red");
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

    // Header
    doc.setFont("helvetica", "bold");
    doc.setFontSize(26);
    doc.text("BAZRO INVOICE", 105, 30, { align: "center" });
    
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text("9a Commercial St, Camborne TR14 8AT", 105, 37, { align: "center" });
    doc.text("Date: " + new Date().toLocaleString(), 105, 43, { align: "center" });
    
    doc.setLineWidth(0.5);
    doc.line(20, 50, 190, 50);

    // Table
    doc.setFont("helvetica", "bold");
    doc.text("Item", 25, 60);
    doc.text("Qty", 130, 60);
    doc.text("Price", 150, 60);
    doc.text("Total", 175, 60);
    doc.line(20, 63, 190, 63);
    
    doc.setFont("helvetica", "normal");
    let y = 73;
    let grandTotal = 0;

    cart.forEach(item => {
        let lineTotal = item.qty * item.price;
        grandTotal += lineTotal;
        doc.text(item.name, 25, y);
        doc.text(item.qty.toString(), 133, y);
        doc.text("£" + item.price.toFixed(2), 150, y);
        doc.text("£" + lineTotal.toFixed(2), 175, y);
        y += 10;
        if (y > 270) { doc.addPage(); y = 20; }
    });

    doc.line(20, y, 190, y);
    doc.setFontSize(16); doc.setFont("helvetica", "bold");
    doc.text("GRAND TOTAL: £" + grandTotal.toFixed(2), 190, y + 12, { align: "right" });

    const fileName = `Bazro_Invoice_${Date.now()}.pdf`;
    
    // Get PDF as blob for sharing
    const pdfBlob = doc.output('blob');
    const file = new File([pdfBlob], fileName, { type: 'application/pdf' });

    // Web Share API
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
            await navigator.share({
                files: [file],
                title: 'Bazro Invoice',
                text: 'Thank you for shopping at Bazro!'
            });
            cart = []; renderCart(); stopScan();
        } catch (err) {
            doc.save(fileName); // Fallback to download
        }
    } else {
        doc.save(fileName); // Fallback for desktop/older phones
        notify("Saved to Downloads", "blue");
        cart = []; renderCart(); stopScan();
    }
}

function downloadDaily() {
    const today = new Date().toLocaleDateString();
    let text = `BAZRO DAILY REPORT [${today}]\n\n`;
    let grandTotal = 0;
    sales.filter(s => s.date.includes(today)).forEach((s, idx) => {
        let sub = 0; text += `TRANS #${idx+1} (${s.date})\n`;
        s.items.forEach(it => { let l = it.qty * it.price; sub += l; text += `- ${it.name} [x${it.qty}] £${l.toFixed(2)}\n`; });
        text += `Total: £${sub.toFixed(2)}\n\n`; grandTotal += sub;
    });
    text += `GRAND TOTAL FOR DAY: £${grandTotal.toFixed(2)}`;
    const blob = new Blob([text], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `daily_report_${Date.now()}.txt`;
    a.click();
}
</script>

</body>
</html>
