<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS - Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    :root { --orange: #ff512f; --yellow: #f09819; --dark: #141e30; --green: #27ae60; --red: #e74c3c; --gold: #D4AF37; }
    body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: #f4f7f6; padding-bottom: 110px; color: #333; }
    header { background: linear-gradient(135deg, #141e30, #243b55); padding: 18px; text-align: center; color: white; font-size: 24px; font-weight: 800; letter-spacing: 2px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    
    .container { max-width: 500px; margin: auto; padding: 15px; }
    .page { display: none; }
    .active-page { display: block; }
    
    .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.03); }
    h3 { margin-top: 0; color: var(--dark); border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; font-size: 19px; letter-spacing: 0.5px; }
    
    input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; transition: 0.3s; box-sizing: border-box; }
    input:focus { border-color: var(--orange); outline: none; box-shadow: 0 0 8px rgba(255,81,47,0.2); }
    
    button { width: 100%; padding: 15px; margin: 8px 0; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--orange), var(--yellow)); color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: transform 0.1s; }
    button:active { transform: scale(0.98); }
    
    .btn-sec { background: #34495e; }
    .btn-stop { background: var(--red); }
    .btn-pdf { background: #1a1a1a; border: 1px solid var(--gold); color: var(--gold); }
    .btn-flash { background: #f1c40f; color: #000; margin-bottom: 10px; display: none; }
    .btn-backup { background: #6c5ce7; }

    .qty-controls { display: flex; align-items: center; gap: 12px; background: #f8f9fa; padding: 5px 10px; border-radius: 20px; }
    .btn-qty { width: 28px; height: 28px; padding: 0; margin: 0; border-radius: 50%; background: var(--dark); font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .qty-val { font-weight: 800; font-size: 16px; min-width: 15px; text-align: center; }
    
    nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; height: 75px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
    nav button { flex: 1; background: none; color: #95a5a6; border-top: 4px solid transparent; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 0; }
    nav button.active-nav { color: var(--orange); border-top-color: var(--orange); }

    #status-msg { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); padding: 12px 30px; border-radius: 50px; color: white; font-weight: 600; z-index: 9999; opacity: 0; transition: 0.4s; pointer-events: none; text-align: center; }
    
    .row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f0f0f0; align-items: center; }
    .history-item { border-bottom: 2px solid #eee; padding: 15px 0; }
    .history-meta { font-size: 12px; color: #7f8c8d; margin-bottom: 5px; }

    #scanner-view { background: #000; border-radius: 20px; overflow: hidden; display: none; margin-bottom: 15px; padding: 10px; }
    #reader { width: 100%; min-height: 250px; border-radius: 15px; }

    #eod-report-box { padding: 40px; background: white; width: 320px; margin: 15px auto; color: black; display: none; text-align: center; border: 1px solid #eee; font-family: 'Times New Roman', serif; }
    #qrcode { display: none; }
</style>
</head>
<body>

<div id="status-msg"></div>
<header>BAZRO</header>
<div id="qrcode"></div>

<div class="container">
    <div id="scanner-view">
        <div id="reader"></div>
        <button id="flash-btn" class="btn-flash" onclick="toggleFlash()">🔦 FLASH: OFF</button>
        <button class="btn-stop" onclick="stopScan()">CLOSE CAMERA</button>
    </div>

    <div id="page-sales" class="page active-page">
        <div class="card">
            <h3>Premium Checkout</h3>
            <button onclick="startScan('sell')">📷 SCAN ITEM</button>
            <input id="sell_barcode" placeholder="Enter Barcode Manually">
            <button class="btn-sec" onclick="addToCart()">ADD TO BASKET</button>
        </div>
        <div class="card">
            <h3>Basket</h3>
            <div id="cart-list"></div>
            <div style="text-align:right; font-weight:800; font-size:24px; margin:20px 0; color:var(--dark)" id="cart-total">Total: £0.00</div>
            <button style="background:var(--green)" onclick="checkout()">COMPLETE TRANSACTION</button>
            <button class="btn-pdf" onclick="downloadLuxuryInvoice()">📄 DOWNLOAD INVOICE</button>
        </div>
    </div>

    <div id="page-report" class="page">
        <div class="card">
            <h3>End of Day</h3>
            <input type="date" id="report_date">
            <input type="number" id="cash_total" placeholder="Cash Sales (£)">
            <input type="number" id="card_total" placeholder="Card Sales (£)">
            <input type="number" id="expense_total" placeholder="Expenses (£)">
            <input type="number" id="till_cash" placeholder="Till Remaining (£)">
            <button onclick="previewReport()">GENERATE SUMMARY</button>
        </div>
        <div id="eod-report-box">
             <h1 style="margin:0; font-size:40px; letter-spacing:4px;">BAZRO</h1>
             <div id="r_date" style="font-size:18px; margin:10px 0;"></div>
             <p style="font-size:12px; color:gray;">9a Commercial St, Camborne TR14 8AT</p>
             <hr>
             <div style="display:flex; justify-content:space-between; margin:10px 0;"><span>CASH</span><span id="r_cash"></span></div>
             <div style="display:flex; justify-content:space-between; margin:10px 0;"><span>CARD</span><span id="r_card"></span></div>
             <div style="display:flex; justify-content:space-between; margin:10px 0; color:red;"><span>EXPENSES</span><span id="r_exp"></span></div>
             <hr>
             <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:20px;"><span>NET TOTAL</span><span id="r_net"></span></div>
             <p style="margin-top:20px; font-size:14px; color:gray;">Till: <span id="r_till"></span></p>
        </div>
        <button id="share-report-btn" style="display:none; background:var(--green)" onclick="shareReportImage()">📤 SHARE REPORT IMAGE</button>
    </div>

    <div id="page-history" class="page">
        <div class="card">
            <h3>Sales History</h3>
            <div id="history-container"></div>
            <button class="btn-stop" style="margin-top:20px" onclick="clearHistoryPrompt()">CLEAR ALL HISTORY</button>
        </div>
    </div>

    <div id="page-stock" class="page">
        <div class="card">
            <h3>Stock Inventory</h3>
            <button onclick="startScan('add')">📷 SCAN NEW PRODUCT</button>
            <input id="p_barcode" placeholder="Barcode ID">
            <input id="p_name" placeholder="Product Name">
            <input id="p_price" type="number" step="0.01" placeholder="Selling Price £">
            <button onclick="addProduct()">SAVE TO DATABASE</button>
        </div>
        <div class="card">
            <h3>Cloud Backup</h3>
            <button class="btn-backup" onclick="exportData()">💾 EXPORT DATABASE (.JSON)</button>
            <button class="btn-sec" onclick="document.getElementById('importFile').click()">📂 IMPORT DATABASE</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        </div>
    </div>
</div>

<nav>
    <button id="nav-sales" class="active-nav" onclick="showPage('sales')">SHOP</button>
    <button id="nav-report" onclick="showPage('report')">REPORT</button>
    <button id="nav-history" onclick="protectedAccess('history')">HISTORY</button>
    <button id="nav-stock" onclick="showPage('stock')">STOCK</button>
</nav>

<script>
let products = JSON.parse(localStorage.getItem("products") || "{}");
let sales = JSON.parse(localStorage.getItem("sales") || "[]");
let cart = [];
let html5QrCode = null;
const MASTER_PASS = "Yamin@83";

// Updated Info based on provided text
const INFO = {
    name: "BAZRO",
    address: "9a Commercial St, Camborne TR14 8AT",
    phone: "07534 100986"
};

function showPage(p) {
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
    document.getElementById('page-'+p).classList.add('active-page');
    document.getElementById('nav-'+p).classList.add('active-nav');
    if(p === 'history') renderHistory();
    stopScan();
}

function protectedAccess(page) {
    const pass = prompt("Enter Admin Password:");
    if(pass === MASTER_PASS) {
        showPage(page);
    } else {
        notify("Access Denied", "red");
    }
}

function notify(msg, color) {
    const el = document.getElementById("status-msg");
    el.innerText = msg; el.style.background = color; el.style.opacity = "1";
    setTimeout(() => el.style.opacity = "0", 2500);
}

// UPDATED PDF INVOICE GENERATION
async function downloadLuxuryInvoice() {
    const items = cart.length ? cart : (sales[0]?.items || []);
    if (!items.length) return notify("No items to invoice", "red");

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const now = new Date().toLocaleString();
    const receiptID = `BAZ-${Date.now().toString().slice(-6)}`;

    // PDF Header with Logo, Address, Phone, and Date on top
    doc.setFont("helvetica", "bold");
    doc.setFontSize(28);
    doc.text(INFO.name, 105, 20, { align: 'center' }); // Logo/Name [cite: 2]
    
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text(INFO.address, 105, 27, { align: 'center' }); // Address [cite: 3]
    doc.text(`T: ${INFO.phone}`, 105, 32, { align: 'center' }); // Phone
    doc.text(`Date: ${now}`, 105, 37, { align: 'center' }); // Date

    doc.line(20, 42, 190, 42); // Horizontal line separator

    // Table Content [cite: 1]
    let y = 52;
    doc.setFont("helvetica", "bold");
    doc.text("Item", 20, y);
    doc.text("Qty", 130, y);
    doc.text("Price", 170, y);
    
    y += 8;
    doc.setFont("helvetica", "normal");
    let grandTotal = 0;

    items.forEach(i => {
        const lineTotal = i.qty * i.price;
        grandTotal += lineTotal;
        doc.text(i.name.substring(0, 40), 20, y);
        doc.text(i.qty.toString(), 132, y);
        doc.text(`£${i.price.toFixed(2)}`, 170, y);
        y += 7;
    });

    doc.line(20, y + 2, 190, y + 2);
    y += 12;
    doc.setFontSize(14);
    doc.setFont("helvetica", "bold");
    doc.text(`GRAND TOTAL: £${grandTotal.toFixed(2)}`, 190, y, { align: 'right' }); // [cite: 1]

    doc.save(`Bazro_Invoice_${receiptID}.pdf`);
    notify("Invoice Downloaded", "var(--green)");
}

// History Logic
function renderHistory() {
    const container = document.getElementById("history-container");
    if(sales.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:gray;'>No sales records.</p>";
        return;
    }
    container.innerHTML = sales.map((sale, index) => {
        let total = 0;
        const details = sale.items.map(i => {
            total += i.qty * i.price;
            return `<div style="display:flex; justify-content:space-between; font-size:14px;">
                        <span>${i.name} (x${i.qty})</span>
                        <span>£${(i.qty * i.price).toFixed(2)}</span>
                    </div>`;
        }).join("");
        return `<div class="history-item">
                    <div class="history-meta">${sale.date}</div>
                    ${details}
                    <div style="text-align:right; font-weight:bold; color:var(--dark); margin-top:5px;">Total: £${total.toFixed(2)}</div>
                </div>`;
    }).join("");
}

function clearHistoryPrompt() {
    if(confirm("Delete all history permanently?")) {
        sales = [];
        localStorage.setItem("sales", JSON.stringify(sales));
        renderHistory();
    }
}

// Existing Core Functions
function addToCart(manualCode = null) {
    const b = (manualCode || document.getElementById("sell_barcode").value).trim();
    if (!products[b]) return notify("Unknown Barcode", "red");
    let item = cart.find(i => i.barcode === b);
    if (item) item.qty++;
    else cart.push({ barcode: b, name: products[b].name, price: products[b].price, qty: 1 });
    renderCart();
    document.getElementById("sell_barcode").value = "";
}

function renderCart() {
    let t = 0;
    document.getElementById("cart-list").innerHTML = cart.map(i => {
        t += i.qty * i.price;
        return `<div class="row">
            <span style="flex:1; font-weight:600;">${i.name}</span>
            <div class="qty-controls">
                <button class="btn-qty" onclick="updateQty('${i.barcode}', -1)" style="color:white">-</button>
                <span class="qty-val">${i.qty}</span>
                <button class="btn-qty" onclick="updateQty('${i.barcode}', 1)" style="color:white">+</button>
            </div>
            <span style="width:70px; text-align:right; font-weight:bold;">£${(i.qty*i.price).toFixed(2)}</span>
        </div>`;
    }).join("");
    document.getElementById("cart-total").innerText = `Total: £${t.toFixed(2)}`;
}

function updateQty(barcode, change) {
    let item = cart.find(i => i.barcode === barcode);
    if (!item) return;
    item.qty += change;
    if (item.qty <= 0) cart = cart.filter(i => i.barcode !== barcode);
    renderCart();
}

function checkout() {
    if(!cart.length) return;
    sales.unshift({ date: new Date().toLocaleString(), items: [...cart] });
    localStorage.setItem("sales", JSON.stringify(sales));
    notify("Transaction Complete", "var(--green)");
    cart = []; renderCart();
}

function addProduct() {
    const b = document.getElementById("p_barcode").value, n = document.getElementById("p_name").value, p = document.getElementById("p_price").value;
    if(!b || !n || !p) return notify("Missing Info", "red");
    products[b] = { name: n, price: Number(p) };
    localStorage.setItem("products", JSON.stringify(products));
    notify(n + " Saved", "var(--green)");
}

async function startScan(mode) {
    if (html5QrCode) { try { await html5QrCode.stop(); } catch(e) {} }
    document.getElementById("reader").innerHTML = "";
    document.getElementById("scanner-view").style.display = "block";
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (code) => {
        if (mode === 'add') {
            document.getElementById("p_barcode").value = code;
            stopScan();
        } else {
            addToCart(code);
            notify("Item Added!", "var(--green)");
        }
    });
}

function stopScan() {
    if (html5QrCode) { html5QrCode.stop(); }
    document.getElementById("scanner-view").style.display = "none";
}

function exportData() {
    const blob = new Blob([JSON.stringify({products, sales})], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Bazro_DB.json`;
    a.click();
}

function importData(e) {
    const reader = new FileReader();
    reader.onload = (ev) => {
        const data = JSON.parse(ev.target.result);
        localStorage.setItem("products", JSON.stringify(data.products));
        localStorage.setItem("sales", JSON.stringify(data.sales));
        location.reload();
    };
    reader.readAsText(e.target.files[0]);
}

function previewReport() {
    const d = document.getElementById("report_date").value;
    if(!d) return;
    const cash = Number(document.getElementById("cash_total").value);
    const card = Number(document.getElementById("card_total").value);
    const exp = Number(document.getElementById("expense_total").value);
    document.getElementById("r_date").innerText = d.split('-').reverse().join('/');
    document.getElementById("r_cash").innerText = "£" + cash.toFixed(2);
    document.getElementById("r_card").innerText = "£" + card.toFixed(2);
    document.getElementById("r_exp").innerText = "£" + exp.toFixed(2);
    document.getElementById("r_net").innerText = "£" + (cash + card - exp).toFixed(2);
    document.getElementById("r_till").innerText = "£" + Number(document.getElementById("till_cash").value).toFixed(2);
    document.getElementById("eod-report-box").style.display = "block";
    document.getElementById("share-report-btn").style.display = "block";
}
</script>
</body>
</html>
