<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS - Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    :root { --orange: #ff512f; --yellow: #f09819; --dark: #141e30; --green: #27ae60; --red: #e74c3c; --gold: #D4AF37; }
    body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: #f4f7f6; padding-bottom: 110px; color: #333; }
    header { background: linear-gradient(135deg, #141e30, #243b55); padding: 18px; text-align: center; color: white; font-size: 24px; font-weight: 800; letter-spacing: 2px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    
    .container { max-width: 500px; margin: auto; padding: 15px; }
    .page { display: none; }
    .active-page { display: block; }
    
    .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.03); }
    h3 { margin-top: 0; color: var(--dark); border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; font-size: 19px; }
    
    input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 15px; margin: 8px 0; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--orange), var(--yellow)); color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    
    .btn-sec { background: #34495e; }
    .btn-stop { background: var(--red); }
    .btn-pdf { background: #1a1a1a; border: 1px solid var(--gold); color: var(--gold); }
    .btn-qr { background: var(--gold); color: #000; }
    
    /* QR Overlay */
    #qr-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; flex-direction: column; color: white; }
    #qr-code-box { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }

    /* Qty Toggle */
    .qty-controls { display: flex; align-items: center; gap: 12px; background: #f8f9fa; padding: 5px 10px; border-radius: 20px; }
    .btn-qty { width: 28px; height: 28px; background: var(--dark); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; border: none; }
    
    nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; height: 75px; }
    nav button { flex: 1; background: none; color: #95a5a6; border-top: 4px solid transparent; font-size: 11px; text-transform: uppercase; }
    nav button.active-nav { color: var(--orange); border-top-color: var(--orange); }

    #status-msg { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); padding: 12px 30px; border-radius: 50px; color: white; font-weight: 600; z-index: 9999; opacity: 0; transition: 0.4s; pointer-events: none; }
    
    .row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f0f0f0; align-items: center; }
    #scanner-view { background: #000; border-radius: 20px; display: none; margin-bottom: 15px; padding: 10px; text-align: center; }
    #reader { width: 100%; min-height: 250px; }
</style>
</head>
<body>

<div id="qr-overlay" onclick="this.style.display='none'">
    <h2 style="color:var(--gold)">SCAN TO DOWNLOAD</h2>
    <div id="qr-code-box"></div>
    <p>Customer can scan this with their phone</p>
    <button style="width:200px" onclick="document.getElementById('qr-overlay').style.display='none'">CLOSE</button>
</div>

<div id="status-msg"></div>
<header>BAZRO</header>

<div class="container">
    <div id="scanner-view">
        <div id="reader"></div>
        <button id="flash-btn" style="display:none; background:#f1c40f; color:000; margin-bottom:10px;" onclick="toggleFlash()">🔦 FLASH: OFF</button>
        <button class="btn-stop" onclick="stopScan()">CLOSE CAMERA</button>
    </div>

    <div id="page-sales" class="page active-page">
        <div class="card">
            <h3>Premium Checkout</h3>
            <button onclick="startScan('sell')">📷 SCAN ITEM</button>
            <input id="sell_barcode" placeholder="Enter Barcode Manually">
            <button class="btn-sec" onclick="addToCart()">ADD TO BASKET</button>
        </div>
        <div class="card">
            <h3>Basket</h3>
            <div id="cart-list"></div>
            <div style="text-align:right; font-weight:800; font-size:24px; margin:20px 0;" id="cart-total">Total: £0.00</div>
            <button style="background:var(--green)" onclick="checkout()">COMPLETE SALE</button>
            <button class="btn-qr" onclick="generateInvoiceQR()">📱 CUSTOMER SCAN (QR)</button>
            <button class="btn-pdf" onclick="downloadLuxuryInvoice()">📄 DOWNLOAD PDF</button>
        </div>
    </div>

    <div id="page-stock" class="page">
        <div class="card">
            <h3>Inventory</h3>
            <button onclick="startScan('add')">📷 SCAN NEW PRODUCT</button>
            <input id="p_barcode" placeholder="Barcode ID">
            <input id="p_name" placeholder="Product Name">
            <input id="p_price" type="number" step="0.01" placeholder="Price £">
            <button onclick="addProduct()">SAVE PRODUCT</button>
        </div>
        <div class="card">
            <h3>Database</h3>
            <button class="btn-sec" onclick="exportData()">💾 EXPORT BACKUP</button>
            <button class="btn-sec" onclick="document.getElementById('importFile').click()">📂 IMPORT BACKUP</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        </div>
    </div>
    
    <div id="page-report" class="page">
        <div class="card">
            <h3>End of Day</h3>
            <input type="date" id="report_date">
            <input type="number" id="cash_total" placeholder="Cash (£)">
            <input type="number" id="card_total" placeholder="Card (£)">
            <input type="number" id="expense_total" placeholder="Expenses (£)">
            <button onclick="previewReport()">PREVIEW REPORT</button>
        </div>
    </div>
</div>

<nav>
    <button id="nav-sales" class="active-nav" onclick="showPage('sales')">SHOP</button>
    <button id="nav-report" onclick="showPage('report')">REPORT</button>
    <button id="nav-stock" onclick="showPage('stock')">STOCK</button>
</nav>

<script>
let products = JSON.parse(localStorage.getItem("products") || "{}");
let sales = JSON.parse(localStorage.getItem("sales") || "[]");
let cart = [];
let html5QrCode = null;
let scanPaused = false;
let isFlashOn = false;

const INFO = { name: "BAZRO", address: "9a Commercial St, Camborne TR14 8AT", phone: "07534 100986" };

function showPage(p) {
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
    document.getElementById('page-'+p).classList.add('active-page');
    document.getElementById('nav-'+p).classList.add('active-nav');
    stopScan();
}

function notify(msg, color) {
    const el = document.getElementById("status-msg");
    el.innerText = msg; el.style.background = color; el.style.opacity = "1";
    setTimeout(() => el.style.opacity = "0", 2500);
}

// LUXURY INVOICE GENERATOR (Base function for both PDF and QR)
function createInvoiceData() {
    const items = cart.length ? cart : (sales[0]?.items || []);
    if (!items.length) return null;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', [80, 200]); // Receipt size for better QR fit

    doc.setFontSize(18); doc.text(INFO.name, 40, 15, {align:'center'});
    doc.setFontSize(8); doc.text(INFO.address, 40, 20, {align:'center'});
    doc.text(`Tel: ${INFO.phone}`, 40, 24, {align:'center'});
    doc.line(5, 28, 75, 28);
    
    let y = 35;
    let total = 0;
    items.forEach(i => {
        let sub = i.qty * i.price;
        total += sub;
        doc.text(`${i.name.substring(0,20)} x${i.qty}`, 5, y);
        doc.text(`£${sub.toFixed(2)}`, 75, y, {align:'right'});
        y += 7;
    });
    
    doc.line(5, y, 75, y);
    doc.setFontSize(12); doc.text(`TOTAL: £${total.toFixed(2)}`, 75, y + 10, {align:'right'});
    return doc;
}

function downloadLuxuryInvoice() {
    const doc = createInvoiceData();
    if(doc) doc.save(`Bazro_Invoice.pdf`);
}

// GENERATE QR FOR CUSTOMER
function generateInvoiceQR() {
    const doc = createInvoiceData();
    if(!doc) return notify("Basket is empty", "red");

    const pdfBase64 = doc.output('datauristring');
    
    document.getElementById("qr-code-box").innerHTML = "";
    new QRCode(document.getElementById("qr-code-box"), {
        text: pdfBase64,
        width: 250,
        height: 250
    });
    
    document.getElementById("qr-overlay").style.display = "flex";
}

// SCANNER (RESTORED A-Z)
async function startScan(mode) {
    if (html5QrCode) { try { await html5QrCode.stop(); } catch(e) {} }
    document.getElementById("reader").innerHTML = "";
    document.getElementById("scanner-view").style.display = "block";
    html5QrCode = new Html5Qrcode("reader");

    try {
        await html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (code) => {
            if (scanPaused) return;
            if (mode === 'add') {
                document.getElementById("p_barcode").value = code;
                stopScan();
                notify("Barcode Caught!", "var(--green)");
            } else {
                if (!products[code]) { notify("Unknown Item", "red"); return; }
                scanPaused = true;
                addToCart(code);
                notify(products[code].name + " Added!", "var(--green)");
                setTimeout(() => { scanPaused = false; }, 2000); // 2 SECONDS DELAY
            }
        });
        setTimeout(() => {
            const track = html5QrCode.getRunningTrackCapabilities();
            if(track.torch) document.getElementById("flash-btn").style.display = "block";
        }, 1000);
    } catch (err) { notify("Camera Error", "red"); }
}

async function stopScan() {
    if (html5QrCode) { await html5QrCode.stop(); html5QrCode.clear(); }
    document.getElementById("scanner-view").style.display = "none";
}

async function toggleFlash() {
    isFlashOn = !isFlashOn;
    await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isFlashOn }] });
    document.getElementById("flash-btn").innerText = isFlashOn ? "🔦 FLASH: ON" : "🔦 FLASH: OFF";
}

// CART
function addToCart(manualCode = null) {
    const b = (manualCode || document.getElementById("sell_barcode").value).trim();
    if (!products[b]) return notify("Unknown Barcode", "red");
    let item = cart.find(i => i.barcode === b);
    if (item) item.qty++;
    else cart.push({ barcode: b, name: products[b].name, price: products[b].price, qty: 1 });
    renderCart();
    document.getElementById("sell_barcode").value = "";
}

function updateQty(barcode, change) {
    let item = cart.find(i => i.barcode === barcode);
    if (!item) return;
    item.qty += change;
    if (item.qty <= 0) cart = cart.filter(i => i.barcode !== barcode);
    renderCart();
}

function renderCart() {
    let t = 0;
    document.getElementById("cart-list").innerHTML = cart.map(i => {
        t += i.qty * i.price;
        return `<div class="row">
            <span style="flex:1; font-weight:600;">${i.name}</span>
            <div class="qty-controls">
                <button class="btn-qty" onclick="updateQty('${i.barcode}', -1)">-</button>
                <span class="qty-val">${i.qty}</span>
                <button class="btn-qty" onclick="updateQty('${i.barcode}', 1)">+</button>
            </div>
            <span style="width:70px; text-align:right; font-weight:bold;">£${(i.qty*i.price).toFixed(2)}</span>
        </div>`;
    }).join("");
    document.getElementById("cart-total").innerText = `Total: £${t.toFixed(2)}`;
}

function checkout() {
    if(!cart.length) return;
    sales.unshift({ date: new Date().toLocaleString(), items: [...cart] });
    localStorage.setItem("sales", JSON.stringify(sales));
    notify("Transaction Complete", "var(--green)");
    cart = []; renderCart();
}

// STOCK
function addProduct() {
    const b = document.getElementById("p_barcode").value, n = document.getElementById("p_name").value, p = document.getElementById("p_price").value;
    if(!b || !n || !p) return notify("Missing Info", "red");
    products[b] = { name: n, price: Number(p) };
    localStorage.setItem("products", JSON.stringify(products));
    notify(n + " Saved", "var(--green)");
}

function exportData() {
    const blob = new Blob([JSON.stringify({products, sales})], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `Bazro_Backup.json`; a.click();
}

function importData(e) {
    const reader = new FileReader();
    reader.onload = (ev) => {
        const data = JSON.parse(ev.target.result);
        localStorage.setItem("products", JSON.stringify(data.products));
        localStorage.setItem("sales", JSON.stringify(data.sales));
        location.reload();
    };
    reader.readAsText(e.target.files[0]);
}
</script>
</body>
</html>
