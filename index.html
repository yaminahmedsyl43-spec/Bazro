<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS - Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root { --orange: #ff512f; --yellow: #f09819; --dark: #141e30; --green: #27ae60; --red: #e74c3c; --gold: #D4AF37; }
body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: #f4f7f6; padding-bottom: 110px; color: #333; }
header { background: linear-gradient(135deg, #141e30, #243b55); padding: 18px; text-align: center; color: white; font-size: 24px; font-weight: 800; letter-spacing: 2px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
.container { max-width: 500px; margin: auto; padding: 15px; }
.page { display: none; }
.active-page { display: block; }
.card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.03); }
h3 { margin-top: 0; color: var(--dark); border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; font-size: 19px; letter-spacing: 0.5px; }
input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
button { width: 100%; padding: 15px; margin: 8px 0; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--orange), var(--yellow)); color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
.btn-sec { background: #34495e; }
.btn-stop { background: var(--red); }
.btn-pdf { background: #1a1a1a; border: 1px solid var(--gold); color: var(--gold); }
.btn-backup { background: #6c5ce7; }
nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #eee; height: 75px; }
nav button { flex: 1; background: none; color: #95a5a6; border-top: 4px solid transparent; font-size: 10px; padding: 0; }
nav button.active-nav { color: var(--orange); border-top-color: var(--orange); }
#status-msg { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); padding: 12px 30px; border-radius: 50px; color: white; font-weight: 600; z-index: 9999; opacity: 0; transition: 0.4s; }
</style>
</head>
<body>

<div id="status-msg"></div>
<header>BAZRO</header>

<div class="container">
<div id="page-sales" class="page active-page">
<div class="card">
<h3>Premium Checkout</h3>
<input id="sell_barcode" placeholder="Enter Barcode">
<button class="btn-sec" onclick="addToCart()">ADD TO BASKET</button>
</div>

<div class="card">
<h3>Basket</h3>
<div id="cart-list"></div>
<div style="text-align:right; font-weight:800; font-size:24px; margin:20px 0;" id="cart-total">Total: £0.00</div>
<button style="background:var(--green)" onclick="checkout()">COMPLETE TRANSACTION</button>
<button class="btn-pdf" onclick="downloadLuxuryInvoice()">📄 DOWNLOAD PDF INVOICE (OPTIONAL)</button>
</div>
</div>
</div>

<script>

let cart = [];

const INFO = {
    name: "BAZRO",
    address: "9a Commercial St, Camborne TR14 8AT",
    phone: "07534 100986"
};

function notify(msg, color) {
    const el = document.getElementById("status-msg");
    el.innerText = msg;
    el.style.background = color;
    el.style.opacity = "1";
    setTimeout(() => el.style.opacity = "0", 2500);
}

async function downloadLuxuryInvoice() {

    if (!cart.length) {
        notify("Basket Empty - Invoice Optional", "red");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','mm','a4');

    const invoiceNumber = `INV-${Date.now().toString().slice(-6)}`;
    const today = new Date().toLocaleDateString("en-GB");

    let y = 20;

    doc.setFont("helvetica","bold");
    doc.setFontSize(22);
    doc.text(INFO.name, 20, y);

    doc.setFont("helvetica","normal");
    doc.setFontSize(10);
    doc.text(INFO.address, 20, y+7);
    doc.text("Phone: " + INFO.phone, 20, y+13);

    doc.setFont("helvetica","bold");
    doc.text("INVOICE", 150, y);

    doc.setFont("helvetica","normal");
    doc.text("Invoice No: " + invoiceNumber, 150, y+7);
    doc.text("Date: " + today, 150, y+14);

    y += 30;

    doc.setFont("helvetica","bold");
    doc.text("Description", 20, y);
    doc.text("Qty", 120, y);
    doc.text("Unit £", 140, y);
    doc.text("VAT", 160, y);
    doc.text("Amount £", 180, y);

    doc.line(20, y+2, 200, y+2);
    y += 10;

    doc.setFont("helvetica","normal");

    let subtotal = 0;
    let vatTotal = 0;

    cart.forEach(item => {

        const amount = item.qty * item.price;
        const vat = amount * 0.20;

        subtotal += amount;
        vatTotal += vat;

        doc.text(item.name.substring(0,35), 20, y);
        doc.text(item.qty.toString(), 122, y);
        doc.text(item.price.toFixed(2), 140, y);
        doc.text("20%", 162, y);
        doc.text(amount.toFixed(2), 180, y);

        y += 8;
    });

    const total = subtotal + vatTotal;

    y += 10;
    doc.line(120, y, 200, y);
    y += 8;

    doc.setFont("helvetica","bold");
    doc.text("Subtotal", 130, y);
    doc.text("£"+subtotal.toFixed(2), 180, y);

    y += 8;
    doc.text("VAT (20%)", 130, y);
    doc.text("£"+vatTotal.toFixed(2), 180, y);

    y += 10;
    doc.setFontSize(14);
    doc.text("TOTAL GBP", 130, y);
    doc.text("£"+total.toFixed(2), 180, y);

    y += 20;
    doc.setFontSize(10);
    doc.setFont("helvetica","normal");
    doc.text("Thank you for your business.", 20, y);

    doc.save(INFO.name + "_Invoice_" + invoiceNumber + ".pdf");
    notify("PDF Invoice Downloaded","var(--green)");
}

</script>
</body>
</html>
