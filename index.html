<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS - Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    :root { --orange: #ff512f; --yellow: #f09819; --dark: #141e30; --green: #27ae60; --red: #e74c3c; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding-bottom: 80px; min-height: 100vh; }
    header { background: linear-gradient(135deg, var(--orange), var(--yellow)); padding: 15px; text-align: center; color: white; font-size: 22px; font-weight: 800; position: sticky; top: 0; z-index: 100; }
    .container { max-width: 500px; margin: auto; padding: 15px; }
    .page { display: none; }
    .active-page { display: block; }
    .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h3 { margin-top: 0; color: var(--dark); border-bottom: 2px solid var(--orange); padding-bottom: 8px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
    button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--orange), var(--yellow)); color: white; font-weight: bold; cursor: pointer; }
    
    .qty-btn { width: 35px; height: 35px; padding: 0; display: inline-block; margin: 0 5px; background: #eee; color: #333; }
    .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }

    nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; height: 65px; }
    nav button { flex: 1; background: none; color: #777; padding: 0; margin: 0; border-radius: 0; font-size: 11px; height: 100%; box-shadow: none; }
    nav button.active-nav { color: var(--orange); font-weight: 800; border-top: 4px solid var(--orange); }

    .admin-only { display: none; }
    #eod-report-box { padding: 20px; background: white; border: 1px solid #000; width: 280px; margin: 10px auto; color: black; display: none; }
    .eod-line { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #ccc; font-size: 14px; }
    #status-msg { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 20px; color: white; z-index: 9999; opacity: 0; transition: 0.3s; pointer-events: none; }
    #scanner-view { background: black; border-radius: 12px; overflow: hidden; display: none; margin-bottom: 15px; text-align: center; padding: 10px; }
    
    /* New Controls for Scanner */
    .scan-btns { display: flex; gap: 8px; margin-top: 10px; }
    .scan-btns button { margin: 0; flex: 1; }
</style>
</head>
<body>

<div id="status-msg"></div>
<header>BAZRO SHOP</header>

<div class="container">
    <div id="page-sales" class="page active-page">
        <div id="scanner-view">
            <div id="reader"></div>
            <div class="scan-btns">
                <button id="flash-btn" style="background: var(--dark)" onclick="toggleFlash()">🔦 Light: OFF</button>
                <button style="background:var(--red)" onclick="stopScan()">Close</button>
            </div>
        </div>
        <div class="card">
            <h3>Checkout</h3>
            <button onclick="startScan()">📷 Scan Items</button>
            <input id="sell_barcode" placeholder="Manual Barcode">
            <button style="background:var(--dark)" onclick="addToCart()">Add to Cart</button>
        </div>
        <div class="card">
            <h3>Basket</h3>
            <div id="cart-list"></div>
            <div style="text-align:right; font-weight:800; font-size:20px; margin:10px 0; color:var(--orange)" id="cart-total">Total: £0.00</div>
            <button style="background:var(--green)" onclick="checkout()">Complete Sale</button>
        </div>
    </div>

    <div id="page-report" class="page">
        <div class="card">
            <h3>Daily Report Entry</h3>
            <input type="date" id="report_date">
            <input type="number" id="cash_total" placeholder="Cash (£)">
            <input type="number" id="card_total" placeholder="Card (£)">
            <input type="number" id="expense_total" placeholder="Expenses (£)">
            <button onclick="saveAndPreviewReport()">Save & Preview Report</button>
        </div>
        <div id="eod-report-box">
            <div style="font-size:20px; font-weight:900; text-align:center">BAZRO EOD</div>
            <div id="r_date" style="text-align:center; margin-bottom:10px;"></div>
            <div class="eod-line"><span>Cash:</span> <span id="r_cash"></span></div>
            <div class="eod-line"><span>Card:</span> <span id="r_card"></span></div>
            <div class="eod-line"><span>Exp:</span> <span id="r_exp"></span></div>
            <div class="eod-line" style="font-weight:bold"><span>NET:</span> <span id="r_net"></span></div>
        </div>
        <div class="card">
            <h3>Saved Summaries</h3>
            <div id="saved-reports-list" style="font-size:12px"></div>
        </div>
    </div>

    <div id="page-history" class="page">
        <div class="card">
            <h3>Sales History</h3>
            <div id="history-list"></div>
            <button style="background:var(--red); margin-top:20px;" onclick="clearAllSales()">Clear All History</button>
        </div>
    </div>

    <div id="page-stock" class="page">
        <div class="card">
            <h3>Stock Management</h3>
            <input id="p_barcode" placeholder="Barcode ID">
            <input id="p_name" placeholder="Item Name">
            <input id="p_price" type="number" step="0.01" placeholder="Price £">
            <button onclick="addProduct()">Save to Inventory</button>
        </div>
    </div>
</div>

<nav>
    <button id="nav-sales" class="active-nav" onclick="showPage('sales')">🛒 SHOP</button>
    <button id="nav-report" class="admin-only" onclick="showPage('report')">📊 REPORT</button>
    <button id="nav-history" class="admin-only" onclick="showPage('history')">📜 HISTORY</button>
    <button id="nav-stock" class="admin-only" onclick="showPage('stock')">📦 STOCK</button>
    <button id="nav-admin" onclick="unlockAdmin()">🔑 ADMIN</button>
</nav>

<script>
let products = JSON.parse(localStorage.getItem("products") || "{}");
let sales = JSON.parse(localStorage.getItem("sales") || "[]");
let eodReports = JSON.parse(localStorage.getItem("eodReports") || "[]");
let cart = [];
let qrScanner = null;
let isFlashOn = false;

// --- SECURITY & NAVIGATION ---
function unlockAdmin() {
    const pass = prompt("Enter Password:");
    if (pass === "Yamin@83") {
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = "block");
        document.getElementById('nav-admin').style.display = "none";
        notify("Admin Unlocked", "green");
    } else { notify("Wrong Password", "red"); }
}

function showPage(p) {
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
    document.getElementById('page-'+p).classList.add('active-page');
    document.getElementById('nav-'+p).classList.add('active-nav');
    if(p==='history') renderHistory();
    if(p==='report') renderSavedReports();
}

function notify(m, c) {
    const el = document.getElementById("status-msg");
    el.innerText = m; el.style.background = c; el.style.opacity = "1";
    setTimeout(() => el.style.opacity = "0", 2000);
}

// --- CART & SALES ---
function updateQty(barcode, delta) {
    let item = cart.find(i => i.barcode === barcode);
    if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(i => i.barcode !== barcode);
    }
    renderCart();
}

function addToCart(manualCode = null) {
    const b = (manualCode || document.getElementById("sell_barcode").value).trim();
    if (!products[b]) return notify("Unknown Barcode", "red");
    let item = cart.find(i => i.barcode === b);
    if (item) item.qty++; else cart.push({ barcode: b, name: products[b].name, price: products[b].price, qty: 1 });
    renderCart(); document.getElementById("sell_barcode").value = "";
}

function renderCart() {
    let t = 0;
    document.getElementById("cart-list").innerHTML = cart.map(i => {
        t += i.qty * i.price;
        return `<div class="cart-row">
            <div><b>${i.name}</b><br>£${i.price.toFixed(2)}</div>
            <div>
                <button class="qty-btn" onclick="updateQty('${i.barcode}', -1)">-</button>
                <span>${i.qty}</span>
                <button class="qty-btn" onclick="updateQty('${i.barcode}', 1)">+</button>
            </div>
        </div>`;
    }).join("");
    document.getElementById("cart-total").innerText = `Total: £${t.toFixed(2)}`;
}

function checkout() {
    if(!cart.length) return;
    sales.unshift({ id: Date.now(), date: new Date().toLocaleString(), items: [...cart], total: cart.reduce((a,b)=>a+(b.qty*b.price),0) });
    localStorage.setItem("sales", JSON.stringify(sales));
    cart = []; renderCart(); notify("Sale Completed", "green");
}

function renderHistory() {
    document.getElementById("history-list").innerHTML = sales.map(s => `
        <div style="padding:10px; border-bottom:1px solid #eee; font-size:13px;">
            <strong>${s.date}</strong> - Total: £${s.total.toFixed(2)}<br>
            <span style="color:#666">${s.items.map(i => `${i.name} (x${i.qty})`).join(", ")}</span>
        </div>`).join("");
}

// --- SCANNER & CORRECTED FLASHLIGHT ---
async function startScan() {
    document.getElementById("scanner-view").style.display = "block";
    if (!qrScanner) qrScanner = new Html5Qrcode("reader");
    
    qrScanner.start(
        { facingMode: "environment" }, 
        { fps: 20, qrbox: 250 }, 
        (code) => { addToCart(code); notify("Scanned!", "green"); }
    ).catch(err => {
        notify("Camera Error", "red");
        document.getElementById("scanner-view").style.display = "none";
    });
}

async function toggleFlash() {
    if (!qrScanner) return;
    try {
        const track = qrScanner.getRunningTrack();
        if (!track) return notify("Camera starting...", "orange");

        const capabilities = track.getCapabilities();
        if (!capabilities.torch) return notify("No Flash on device", "red");

        isFlashOn = !isFlashOn;
        await track.applyConstraints({
            advanced: [{ torch: isFlashOn }]
        });
        
        document.getElementById("flash-btn").innerText = isFlashOn ? "🔦 Light: ON" : "🔦 Light: OFF";
        document.getElementById("flash-btn").style.background = isFlashOn ? "var(--green)" : "var(--dark)";
    } catch (e) {
        notify("Flash Error", "red");
    }
}

function stopScan() { 
    if(qrScanner) {
        qrScanner.stop().then(() => {
            isFlashOn = false;
            document.getElementById("flash-btn").innerText = "🔦 Light: OFF";
            document.getElementById("flash-btn").style.background = "var(--dark)";
        });
    }
    document.getElementById("scanner-view").style.display = "none"; 
}

// --- STOCK & REPORTS ---
function addProduct() {
    const b = document.getElementById("p_barcode").value, n = document.getElementById("p_name").value, p = document.getElementById("p_price").value;
    if(!b || !n || !p) return notify("Fill all fields", "red");
    products[b] = { name: n, price: Number(p) };
    localStorage.setItem("products", JSON.stringify(products));
    notify("Stock Updated", "green");
}

function saveAndPreviewReport() {
    const d = document.getElementById("report_date").value;
    const cash = Number(document.getElementById("cash_total").value);
    const card = Number(document.getElementById("card_total").value);
    const exp = Number(document.getElementById("expense_total").value);
    if(!d) return notify("Select Date", "red");

    const report = { date: d, cash, card, exp, net: (cash + card - exp) };
    eodReports.unshift(report);
    localStorage.setItem("eodReports", JSON.stringify(eodReports));

    document.getElementById("r_date").innerText = d;
    document.getElementById("r_cash").innerText = "£"+cash.toFixed(2);
    document.getElementById("r_card").innerText = "£"+card.toFixed(2);
    document.getElementById("r_exp").innerText = "£"+exp.toFixed(2);
    document.getElementById("r_net").innerText = "£"+report.net.toFixed(2);
    document.getElementById("eod-report-box").style.display = "block";
    renderSavedReports();
    notify("Report Saved", "green");
}

function renderSavedReports() {
    document.getElementById("saved-reports-list").innerHTML = eodReports.map(r => `
        <div style="padding:8px; border-bottom:1px solid #eee">
            <b>${r.date}</b> | Cash: £${r.cash} | Card: £${r.card} | Net: £${r.net.toFixed(2)}
        </div>`).join("");
}

function clearAllSales() { if(confirm("Clear history?")) { sales = []; localStorage.setItem("sales", "[]"); renderHistory(); } }
</script>
</body>
</html>
