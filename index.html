<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazro POS</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root{
  --primary:#222831;
  --accent:#00adb5;
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#222;
}
body{
  margin:0;
  font-family:system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:var(--primary);
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:700;
}
.container{
  max-width:520px;
  margin:auto;
  padding:15px;
}
.card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}
input,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ddd;
}
button{
  border:none;
  font-weight:600;
  background:var(--accent);
  color:#fff;
}
button.secondary{
  background:#393e46;
}
#reader{margin-top:10px;}
.cart-item{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  font-size:14px;
}
.total{
  font-size:18px;
  font-weight:700;
  text-align:right;
  margin-top:10px;
}
a{
  display:block;
  text-align:center;
  margin-top:10px;
  color:var(--accent);
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>
<header>BAZRO POS</header>

<div class="container">

<div class="card">
<h3>Add / Update Product</h3>
<div id="reader"></div>
<button class="secondary" onclick="startScanner('add')">📷 Scan Barcode</button>
<input id="barcode" placeholder="Barcode">
<input id="name" placeholder="Product name">
<input id="price" type="number" placeholder="Price">
<input id="stock" type="number" placeholder="Stock">
<button onclick="addProduct()">Save Product</button>
</div>

<div class="card">
<h3>Sell Products</h3>
<button class="secondary" onclick="startScanner('sell')">📷 Scan to Sell</button>
<input id="sellBarcode" placeholder="Manual barcode">
<button onclick="addToCart()">Add</button>

<div id="cart"></div>
<div class="total" id="total">Total: £0.00</div>

<button onclick="checkout()">Checkout</button>
<a href="history.html">📊 View Sales History</a>
</div>

</div>

<script>
let products=JSON.parse(localStorage.getItem("products"))||{};
let sales=JSON.parse(localStorage.getItem("sales"))||[];
let cart=[];
let scanner;
let scanMode="sell";

function startScanner(mode){
  scanMode=mode;
  scanner=new Html5Qrcode("reader");
  scanner.start({facingMode:"environment"},{fps:10,qrbox:250},
  code=>{
    if(scanMode==="add"){
      document.getElementById("barcode").value=code;
    }else{
      addToCart(code);
    }
    scanner.stop();
  });
}

function addProduct(){
  let b=barcode.value,n=name.value,p=price.value,s=stock.value;
  if(!b||!n||!p) return alert("Missing fields");
  products[b]={name:n,price:+p,stock:+s||0};
  localStorage.setItem("products",JSON.stringify(products));
  alert("Product saved");
}

function addToCart(code=null){
  let b=code||sellBarcode.value;
  let p=products[b];
  if(!p||p.stock<=0) return alert("Not available");
  let item=cart.find(i=>i.barcode===b);
  item?item.qty++:cart.push({barcode:b,name:p.name,price:p.price,qty:1});
  p.stock--;
  localStorage.setItem("products",JSON.stringify(products));
  renderCart();
}

function renderCart(){
  let t=0;
  cartDiv=document.getElementById("cart");
  cartDiv.innerHTML=cart.map(i=>{
    let l=i.price*i.qty;
    t+=l;
    return `<div class="cart-item"><span>${i.qty}x ${i.name}</span><span>£${l.toFixed(2)}</span></div>`;
  }).join("");
  total.innerText=`Total: £${t.toFixed(2)}`;
}

function checkout(){
  if(!cart.length) return;
  sales.push({date:new Date().toLocaleString(),items:cart});
  localStorage.setItem("sales",JSON.stringify(sales));
  cart=[];
  renderCart();
  alert("Sale saved");
}
</script>
</body>
</html>
