<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bazro POS</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root{
  --p:#2a5298;
  --g1:#1e3c72;
  --g2:#2a5298;
}
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f7f6;
  color:#333;
}
header{
  background:linear-gradient(135deg,var(--g1),var(--g2));
  color:white;
  text-align:center;
  padding:18px;
  font-weight:800;
  font-size:22px;
}
.container{
  padding:15px;
  max-width:520px;
  margin:auto;
}
.card{
  background:white;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
input,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ddd;
}
button{
  border:none;
  background:var(--p);
  color:white;
  font-weight:700;
}
.btn-scan{background:#00b894}
.btn-stop{background:#d63031;display:none}
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 0;
  border-bottom:1px solid #eee;
}
.qty{
  display:flex;
  gap:6px;
  align-items:center;
}
.qty button{
  width:32px;
  padding:4px;
  background:#eee;
  color:#111;
  font-weight:800;
}
.total{
  text-align:right;
  font-size:18px;
  font-weight:800;
  margin-top:10px;
  color:var(--p);
}
#reader{
  margin:10px 0;
}
</style>
</head>

<body>

<header>BAZRO POS</header>

<div class="container">

<!-- ADD PRODUCT -->
<div class="card">
<h3>Manage Inventory</h3>

<input id="barcode" placeholder="Barcode">
<input id="name" placeholder="Product name">
<input id="price" type="number" step="0.01" placeholder="Price (£)">
<input id="stock" type="number" placeholder="Stock">

<button onclick="addProduct()">Save Product</button>
</div>

<!-- SELL -->
<div class="card">
<h3>Sell</h3>

<div id="reader"></div>
<button id="startBtn" class="btn-scan" onclick="startScanner()">📷 Start Scan</button>
<button id="stopBtn" class="btn-stop" onclick="stopScanner()">🛑 Stop</button>

<input id="sellBarcode" placeholder="Manual barcode">
<button onclick="addToCart()">Add to Cart</button>

<div id="cartList"></div>
<div class="total" id="total">Total: £0.00</div>

<button onclick="checkout()">Checkout</button>
<button onclick="openInvoice()">🧾 Invoice</button>
</div>

</div>

<script>
/* ===== DATA ===== */
let products = JSON.parse(localStorage.getItem("products") || "{}");
let cart = [];
let sales = JSON.parse(localStorage.getItem("sales") || "[]");

/* ===== ADD PRODUCT (FIXED) ===== */
function addProduct(){
  const b = barcode.value.trim();
  const n = name.value.trim();
  const p = price.value;
  const s = stock.value || 0;

  if(b===""||n===""||p===""){
    alert("Barcode, name and price required");
    return;
  }

  products[b] = {
    name:n,
    price:parseFloat(p),
    stock:parseInt(s)
  };

  localStorage.setItem("products",JSON.stringify(products));

  barcode.value=name.value=price.value=stock.value="";
  alert("Product saved");
}

/* ===== CART ===== */
function addToCart(code=null){
  const b = (code||sellBarcode.value).trim();
  const prod = products[b];

  if(!prod){ alert("Product not found"); return; }
  if(prod.stock<=0){ alert("Out of stock"); return; }

  let item = cart.find(i=>i.barcode===b);
  if(item) item.qty++;
  else cart.push({barcode:b,name:prod.name,price:prod.price,qty:1});

  prod.stock--;
  localStorage.setItem("products",JSON.stringify(products));
  sellBarcode.value="";
  updateUI();
}

function changeQty(b,d){
  let i = cart.find(x=>x.barcode===b);
  if(!i) return;

  if(d>0 && products[b].stock<=0) return;

  i.qty+=d;
  products[b].stock-=d;

  if(i.qty<=0) cart = cart.filter(x=>x.barcode!==b);

  localStorage.setItem("products",JSON.stringify(products));
  updateUI();
}

function updateUI(){
  const list = document.getElementById("cartList");
  let total = 0;

  list.innerHTML = cart.map(i=>{
    let l = i.qty*i.price;
    total+=l;
    return `
    <div class="cart-item">
      <span><strong>${i.name}</strong><br>£${i.price.toFixed(2)}</span>
      <div class="qty">
        <button onclick="changeQty('${i.barcode}',-1)">−</button>
        <strong>${i.qty}</strong>
        <button onclick="changeQty('${i.barcode}',1)">+</button>
      </div>
      <strong>£${l.toFixed(2)}</strong>
    </div>`;
  }).join("");

  totalDiv.innerText = `Total: £${total.toFixed(2)}`;
}

/* ===== SCANNER (UNCHANGED – iPHONE SAFE) ===== */
let html5QrCode;

function startScanner(){
  startBtn.style.display="none";
  stopBtn.style.display="block";

  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    {facingMode:"environment"},
    {fps:10,qrbox:{width:250,height:150}},
    txt=>addToCart(txt)
  );
}

function stopScanner(){
  html5QrCode.stop().then(()=>{
    startBtn.style.display="block";
    stopBtn.style.display="none";
  });
}

/* ===== CHECKOUT ===== */
function checkout(){
  if(!cart.length){ alert("Cart empty"); return; }

  sales.push({date:new Date().toLocaleString(),items:[...cart]});
  localStorage.setItem("sales",JSON.stringify(sales));

  cart=[];
  updateUI();
  alert("Sale saved");
}

/* ===== INVOICE ===== */
function openInvoice(){
  if(!sales.length) return;

  const s = sales[sales.length-1];
  let rows="",total=0;

  s.items.forEach(i=>{
    let l=i.qty*i.price;
    total+=l;
    rows+=`<tr><td>${i.name}</td><td>${i.qty}</td><td>£${l.toFixed(2)}</td></tr>`;
  });

  const w=window.open("","inv");
  w.document.write(`
  <html><body style="font-family:sans-serif;background:#f4f7f6;padding:20px">
  <div style="max-width:400px;margin:auto;background:white;padding:20px;border-radius:12px">
  <h2 style="text-align:center;color:#2a5298">BAZRO</h2>
  <p>${s.date}</p>
  <table width="100%">${rows}</table>
  <h3 style="text-align:right">Total £${total.toFixed(2)}</h3>
  </div></body></html>`);
  w.print();
}
</script>

</body>
</html>
