<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS - Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    :root { --orange: #ff512f; --yellow: #f09819; --dark: #141e30; --green: #27ae60; --red: #e74c3c; --gold: #D4AF37; }
    body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: #f4f7f6; padding-bottom: 110px; color: #333; }
    header { background: linear-gradient(135deg, #141e30, #243b55); padding: 18px; text-align: center; color: white; font-size: 24px; font-weight: 800; letter-spacing: 2px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    
    .container { max-width: 500px; margin: auto; padding: 15px; }
    .page { display: none; }
    .active-page { display: block; }
    
    .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.03); }
    h3 { margin-top: 0; color: var(--dark); border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; font-size: 19px; }
    
    input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 15px; margin: 8px 0; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--orange), var(--yellow)); color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    
    .btn-sec { background: #34495e; }
    .btn-stop { background: var(--red); }
    .btn-pdf { background: #1a1a1a; border: 1px solid var(--gold); color: var(--gold); }

    #status-msg { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); padding: 12px 30px; border-radius: 50px; color: white; font-weight: 600; z-index: 9999; opacity: 0; transition: 0.4s; pointer-events: none; text-align: center; }
    
    .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    #scanner-view { background: #000; border-radius: 20px; overflow: hidden; display: none; margin-bottom: 15px; padding: 10px; }
    #reader { width: 100%; min-height: 250px; border-radius: 15px; }

    nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; height: 70px; }
    nav button { flex: 1; background: none; color: #95a5a5; border: none; font-size: 12px; font-weight: bold; }
    nav button.active-nav { color: var(--orange); }
</style>
</head>
<body>

<div id="status-msg"></div>
<header>BAZRO</header>

<div class="container">
    <div id="scanner-view">
        <div id="reader"></div>
        <button class="btn-stop" onclick="stopScan()">CLOSE CAMERA</button>
    </div>

    <div id="page-sales" class="page active-page">
        <div class="card">
            <h3>Premium Checkout</h3>
            <button onclick="startScan('sell')">📷 SCAN ITEM</button>
            <input id="sell_barcode" placeholder="Enter Barcode Manually">
            <button class="btn-sec" onclick="addToCart()">ADD TO BASKET</button>
        </div>
        <div class="card">
            <h3>Basket</h3>
            <div id="cart-list"></div>
            <div style="text-align:right; font-weight:800; font-size:24px; margin:20px 0;" id="cart-total">Total: £0.00</div>
            <button style="background:var(--green)" onclick="checkout()">COMPLETE TRANSACTION</button>
            <button class="btn-pdf" onclick="downloadAndShareInvoice()">📄 DOWNLOAD & SHARE INVOICE</button>
        </div>
    </div>

    <div id="page-stock" class="page">
        <div class="card">
            <h3>Stock Inventory</h3>
            <button onclick="startScan('add')">📷 SCAN NEW PRODUCT</button>
            <input id="p_barcode" placeholder="Barcode ID">
            <input id="p_name" placeholder="Product Name">
            <input id="p_price" type="number" step="0.01" placeholder="Selling Price £">
            <button onclick="addProduct()">SAVE TO DATABASE</button>
        </div>
    </div>
</div>

<nav>
    <button id="nav-sales" class="active-nav" onclick="showPage('sales')">SHOP</button>
    <button id="nav-stock" onclick="showPage('stock')">STOCK</button>
</nav>

<script>
let products = JSON.parse(localStorage.getItem("products") || "{}");
let sales = JSON.parse(localStorage.getItem("sales") || "[]");
let cart = [];
let html5QrCode = null;
let scanPaused = false;

const INFO = { name: "BAZRO", address: "9a Commercial St, Camborne TR14 8AT", phone: "07534 100986" };

function showPage(p) {
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
    document.getElementById('page-'+p).classList.add('active-page');
    document.getElementById('nav-'+p).classList.add('active-nav');
    stopScan();
}

function notify(msg, color) {
    const el = document.getElementById("status-msg");
    el.innerText = msg; el.style.background = color; el.style.opacity = "1";
    setTimeout(() => el.style.opacity = "0", 2500);
}

// INVOICE LOGIC
async function downloadAndShareInvoice() {
    const items = cart.length ? cart : (sales[0]?.items || []);
    if (!items.length) return notify("No items to process", "red");

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', [80, 200]); 

    // RED BAZRO LOGO
    doc.setTextColor(231, 76, 60); 
    doc.setFontSize(22);
    doc.setFont("helvetica", "bold");
    doc.text(INFO.name, 40, 15, { align: 'center' });

    doc.setTextColor(50, 50, 50);
    doc.setFontSize(8);
    doc.setFont("helvetica", "normal");
    doc.text(INFO.address, 40, 22, { align: 'center' });
    doc.text(`Tel: ${INFO.phone}`, 40, 26, { align: 'center' });
    doc.line(5, 30, 75, 30);

    let y = 38;
    let total = 0;
    doc.setFontSize(9);
    items.forEach(i => {
        let sub = i.qty * i.price;
        total += sub;
        doc.text(`${i.name} (x${i.qty})`, 5, y);
        doc.text(`£${sub.toFixed(2)}`, 75, y, { align: 'right' });
        y += 6;
    });

    doc.line(5, y + 2, 75, y + 2);
    doc.setFontSize(12);
    doc.setFont("helvetica", "bold");
    doc.text(`TOTAL: £${total.toFixed(2)}`, 75, y + 10, { align: 'right' });

    const filename = `Bazro_Invoice_${Date.now().toString().slice(-5)}.pdf`;

    // Action 1: Download
    doc.save(filename);
    notify("Downloading Invoice...", "var(--green)");

    // Action 2: Share (if mobile)
    if (navigator.share) {
        const pdfBlob = doc.output('blob');
        const file = new File([pdfBlob], filename, { type: 'application/pdf' });
        try {
            await navigator.share({
                files: [file],
                title: 'Bazro Invoice',
                text: 'Thank you for your purchase!'
            });
        } catch (e) { console.log("Share cancelled"); }
    }
}

async function startScan(mode) {
    if (html5QrCode) { try { await html5QrCode.stop(); } catch(e) {} }
    document.getElementById("reader").innerHTML = "";
    document.getElementById("scanner-view").style.display = "block";
    html5QrCode = new Html5Qrcode("reader");

    try {
        await html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (code) => {
            if (scanPaused) return;
            if (mode === 'add') {
                document.getElementById("p_barcode").value = code;
                stopScan();
                notify("Barcode Captured!", "var(--green)");
            } else {
                if (!products[code]) { notify("Item Not Found", "red"); return; }
                scanPaused = true;
                addToCart(code);
                notify("✔ " + products[code].name + " Added!", "var(--green)");
                setTimeout(() => { scanPaused = false; }, 2000); // 2 SECOND WAIT
            }
        });
    } catch (err) { notify("Camera Error", "red"); }
}

function stopScan() {
    if (html5QrCode) html5QrCode.stop();
    document.getElementById("scanner-view").style.display = "none";
}

function addToCart(manualCode = null) {
    const b = (manualCode || document.getElementById("sell_barcode").value).trim();
    if (!products[b]) return notify("Unknown Barcode", "red");
    let item = cart.find(i => i.barcode === b);
    if (item) item.qty++;
    else cart.push({ barcode: b, name: products[b].name, price: products[b].price, qty: 1 });
    if(!manualCode) notify("Item Added to Basket", "var(--green)");
    renderCart();
    document.getElementById("sell_barcode").value = "";
}

function renderCart() {
    let t = 0;
    document.getElementById("cart-list").innerHTML = cart.map(i => {
        t += i.qty * i.price;
        return `<div class="row"><span>${i.name} x${i.qty}</span><span>£${(i.qty*i.price).toFixed(2)}</span></div>`;
    }).join("");
    document.getElementById("cart-total").innerText = `Total: £${t.toFixed(2)}`;
}

function checkout() {
    if(!cart.length) return;
    sales.unshift({ date: new Date().toLocaleString(), items: [...cart] });
    localStorage.setItem("sales", JSON.stringify(sales));
    notify("Transaction Complete", "var(--green)");
    cart = []; renderCart();
}

function addProduct() {
    const b = document.getElementById("p_barcode").value, n = document.getElementById("p_name").value, p = document.getElementById("p_price").value;
    if(!b || !n || !p) return notify("Missing Info", "red");
    products[b] = { name: n, price: Number(p) };
    localStorage.setItem("products", JSON.stringify(products));
    notify(n + " Saved", "var(--green)");
}
</script>
</body>
</html>
