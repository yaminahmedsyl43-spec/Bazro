<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS - All-in-One</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    :root { 
        --orange: #ff512f; 
        --yellow: #f09819; 
        --dark: #141e30; 
        --green: #27ae60; 
        --red: #e74c3c; 
    }

    body { 
        margin: 0; 
        font-family: 'Segoe UI', sans-serif; 
        background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        padding-bottom: 80px; 
        min-height: 100vh;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    header { background: linear-gradient(135deg, var(--orange), var(--yellow)); padding: 15px; text-align: center; color: white; font-size: 22px; font-weight: 800; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .container { max-width: 500px; margin: auto; padding: 15px; }
    .page { display: none; }
    .active-page { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .card { background: rgba(255, 255, 255, 0.92); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.2); }
    h3 { margin-top: 0; color: var(--dark); border-bottom: 2px solid var(--orange); padding-bottom: 8px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--orange), var(--yellow)); color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    
    .btn-sec { background: #444; }
    .btn-stop { background: var(--red); }
    .btn-pdf { background: #2980b9; }
    .btn-flash { background: #f1c40f; color: #000; margin-bottom: 10px; }
    
    nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; height: 65px; }
    nav button { flex: 1; background: none; color: #777; padding: 0; margin: 0; border-radius: 0; font-size: 11px; height: 100%; box-shadow: none; }
    nav button.active-nav { color: var(--orange); font-weight: 800; border-top: 4px solid var(--orange); }

    /* Admin Restriction Style */
    .admin-only { display: none; }

    .scan-success-popup {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9); color: white; padding: 30px 50px;
        border-radius: 20px; text-align: center; z-index: 10001;
        display: none; pointer-events: none;
    }
    .tick-icon { font-size: 70px; color: var(--green); display: block; margin-bottom: 10px; }
    .animate-pop { animation: fadeInOut 1.2s ease-in-out forwards; }

    @keyframes fadeInOut {
        0% { opacity: 0; transform: translate(-50%, -40%); }
        20% { opacity: 1; transform: translate(-50%, -50%); }
        80% { opacity: 1; transform: translate(-50%, -50%); }
        100% { opacity: 0; transform: translate(-50%, -60%); }
    }

    #status-msg { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 20px; color: white; font-weight: bold; z-index: 9999; opacity: 0; transition: 0.3s; pointer-events: none; }
    #scanner-view, #stock-scanner-view { background: black; border-radius: 12px; overflow: hidden; display: none; margin-bottom: 15px; text-align: center; padding: 10px; }

    #eod-report-box { padding: 30px; background: white; border: 1px solid #000; width: 280px; margin: 10px auto; color: black; display: none; text-align: center; }
    .eod-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #ccc; font-size: 14px; text-align: left; }
</style>
</head>
<body>

<div id="status-msg"></div>
<header id="header-title">BAZRO SHOP</header>

<div id="success-popup" class="scan-success-popup">
    <span class="tick-icon">✔</span>
    <span id="popup-text">Item Added</span>
</div>

<div class="container">
    <div id="page-sales" class="page active-page">
        <div id="scanner-view">
            <div id="reader"></div>
            <button id="flash-btn" class="btn-flash" onclick="toggleFlash()">🔦 Flashlight: OFF</button>
            <button class="btn-stop" onclick="stopScan()">Close Camera</button>
        </div>
        <div class="card">
            <h3>Checkout</h3>
            <button onclick="startScan()">📷 Scan Items</button>
            <input id="sell_barcode" placeholder="Manual Barcode">
            <button class="btn-sec" onclick="addToCart()">Add to Cart</button>
        </div>
        <div class="card">
            <h3>Basket</h3>
            <div id="cart-list"></div>
            <div style="text-align:right; font-weight:800; font-size:20px; margin:10px 0; color:var(--orange)" id="cart-total">Total: £0.00</div>
            <button style="background:var(--green)" onclick="checkout()">Complete Sale</button>
            <button class="btn-pdf" onclick="generatePDF()">📥 Share Invoice (PDF)</button>
        </div>
    </div>

    <div id="page-report" class="page">
        <div class="card">
            <h3>End of Day Summary</h3>
            <input type="date" id="report_date">
            <input type="number" id="cash_total" placeholder="Total Cash Sales (£)">
            <input type="number" id="card_total" placeholder="Total Card Sales (£)">
            <input type="number" id="expense_total" placeholder="Expenses (£)">
            <button onclick="previewReport()">Create Receipt Preview</button>
        </div>
        <div id="eod-report-box">
            <div style="font-size:24px; font-weight:900;">BAZRO</div>
            <div id="r_date" style="font-weight:bold; margin-bottom:10px;"></div>
            <hr>
            <div class="eod-line"><strong>Cash:</strong> <span id="r_cash"></span></div>
            <div class="eod-line"><strong>Card:</strong> <span id="r_card"></span></div>
            <div class="eod-line"><strong>Expenses:</strong> <span id="r_exp"></span></div>
            <div class="eod-line" style="font-size:18px; margin-top:10px;"><strong>NET:</strong> <span id="r_net"></span></div>
        </div>
        <div id="report-actions" style="display:none">
            <button style="background:var(--green)" onclick="shareReportImage()">📤 Share to WhatsApp</button>
        </div>
    </div>

    <div id="page-history" class="page">
        <div class="card">
            <h3>Recent Sales</h3>
            <button class="btn-sec" onclick="exportData()">📤 Export Backup</button>
            <div id="history-list"></div>
            <button style="background:var(--red); margin-top:20px;" onclick="clearAllSales()">Clear All History</button>
        </div>
    </div>

    <div id="page-stock" class="page">
        <div id="stock-scanner-view">
            <div id="stock-reader"></div>
            <button class="btn-stop" onclick="stopStockScan()">Close Camera</button>
        </div>
        <div class="card">
            <h3>Inventory</h3>
            <button onclick="startStockScan()">📷 Scan Barcode</button>
            <input id="p_barcode" placeholder="Barcode ID">
            <input id="p_name" placeholder="Name">
            <input id="p_price" type="number" step="0.01" placeholder="Price">
            <button onclick="addProduct()">Save Product</button>
        </div>
    </div>
</div>

<nav>
    <button id="nav-sales" class="active-nav" onclick="showPage('sales')">🛒 SHOP</button>
    <button id="nav-report" class="admin-only" onclick="showPage('report')">📊 REPORT</button>
    <button id="nav-history" class="admin-only" onclick="showPage('history')">📜 HISTORY</button>
    <button id="nav-stock" class="admin-only" onclick="showPage('stock')">📦 STOCK</button>
    <button id="nav-admin" onclick="unlockAdmin()">🔑 ADMIN</button>
</nav>

<script>
let products = JSON.parse(localStorage.getItem("products") || "{}");
let sales = JSON.parse(localStorage.getItem("sales") || "[]");
let cart = [];
let qrScanner = null;
let stockScanner = null;
let isFlashOn = false;
let scanPaused = false;
let isAdmin = false;

// --- NAVIGATION & SECURITY ---
function showPage(p) {
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
    document.getElementById('page-'+p).classList.add('active-page');
    document.getElementById('nav-'+p).classList.add('active-nav');
    if(p==='history') renderHistory();
    stopScan(); stopStockScan();
}

function unlockAdmin() {
    const pass = prompt("Enter Admin Password:");
    if (pass === "Yamin@83") { // <--- Change your password here
        isAdmin = true;
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = "block");
        document.getElementById('nav-admin').style.display = "none";
        notify("Admin Access Granted", "green");
    } else {
        notify("Access Denied", "red");
    }
}

function notify(msg, color) {
    const el = document.getElementById("status-msg");
    el.innerText = msg; el.style.background = color; el.style.opacity = "1";
    setTimeout(() => el.style.opacity = "0", 2000);
}

// --- SCANNING ---
async function startStockScan() {
    document.getElementById("stock-scanner-view").style.display = "block";
    if (!stockScanner) stockScanner = new Html5Qrcode("stock-reader");
    try {
        await stockScanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (code) => {
            document.getElementById("p_barcode").value = code;
            stopStockScan(); notify("Captured!", "green");
        });
    } catch (e) { notify("Camera Error", "red"); }
}

async function startScan() {
    document.getElementById("scanner-view").style.display = "block";
    if (!qrScanner) qrScanner = new Html5Qrcode("reader");
    try {
        await qrScanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (code) => {
            if (!scanPaused) handleAutoScan(code);
        });
    } catch (e) { notify("Camera Error", "red"); }
}

function handleAutoScan(code) {
    if (!products[code]) return notify("Not Found", "#444");
    scanPaused = true; addToCart(code);
    const popup = document.getElementById("success-popup");
    document.getElementById("popup-text").innerText = products[code].name + " added";
    popup.style.display = "block"; popup.classList.add("animate-pop");
    setTimeout(() => { popup.style.display = "none"; popup.classList.remove("animate-pop"); scanPaused = false; }, 1200);
}

function stopScan() { if(qrScanner) qrScanner.stop(); document.getElementById("scanner-view").style.display = "none"; }
function stopStockScan() { if(stockScanner) stockScanner.stop(); document.getElementById("stock-scanner-view").style.display = "none"; }

// --- POS LOGIC ---
function addProduct() {
    const b = document.getElementById("p_barcode").value, n = document.getElementById("p_name").value, p = document.getElementById("p_price").value;
    if(!b || !n || !p) return notify("Fill all", "red");
    products[b] = { name: n, price: Number(p) };
    localStorage.setItem("products", JSON.stringify(products));
    notify("Saved!", "green");
}

function addToCart(manualCode = null) {
    const b = (manualCode || document.getElementById("sell_barcode").value).trim();
    if (!products[b]) return notify("Unknown Barcode", "red");
    let item = cart.find(i => i.barcode === b);
    if (item) item.qty++; else cart.push({ barcode: b, name: products[b].name, price: products[b].price, qty: 1 });
    renderCart(); document.getElementById("sell_barcode").value = "";
}

function renderCart() {
    let t = 0;
    document.getElementById("cart-list").innerHTML = cart.map(i => {
        t += i.qty * i.price;
        return `<div style="display:flex; justify-content:space-between; padding:5px 0;"><span>${i.name} (x${i.qty})</span><span>£${(i.qty*i.price).toFixed(2)}</span></div>`;
    }).join("");
    document.getElementById("cart-total").innerText = `Total: £${t.toFixed(2)}`;
}

function checkout() {
    if(!cart.length) return;
    sales.unshift({ id: Date.now(), date: new Date().toLocaleString(), items: [...cart] });
    localStorage.setItem("sales", JSON.stringify(sales));
    cart = []; renderCart(); notify("Sale Done", "green");
}

function renderHistory() {
    document.getElementById("history-list").innerHTML = sales.map(s => `<div style="padding:10px; border-bottom:1px solid #ddd; font-size:12px;"><strong>${s.date}</strong> - £${s.items.reduce((a,b)=>a+(b.qty*b.price),0).toFixed(2)}</div>`).join("");
}

function previewReport() {
    const cash = Number(document.getElementById("cash_total").value || 0), card = Number(document.getElementById("card_total").value || 0), exp = Number(document.getElementById("expense_total").value || 0);
    document.getElementById("r_date").innerText = new Date().toLocaleDateString();
    document.getElementById("r_cash").innerText = "£"+cash.toFixed(2);
    document.getElementById("r_card").innerText = "£"+card.toFixed(2);
    document.getElementById("r_exp").innerText = "-£"+exp.toFixed(2);
    document.getElementById("r_net").innerText = "£"+(cash+card-exp).toFixed(2);
    document.getElementById("eod-report-box").style.display = "block";
    document.getElementById("report-actions").style.display = "block";
}

async function shareReportImage() {
    const canvas = await html2canvas(document.getElementById("eod-report-box"));
    canvas.toBlob(async (blob) => {
        const file = new File([blob], "Report.jpg", {type: "image/jpeg"});
        if (navigator.share) await navigator.share({files: [file]});
    });
}

function clearAllSales() {
    if(confirm("Are you sure? This deletes ALL history!")) {
        sales = [];
        localStorage.setItem("sales", JSON.stringify(sales));
        renderHistory();
        notify("History Cleared", "red");
    }
}

function exportData() {
    const data = JSON.stringify({products, sales});
    const blob = new Blob([data], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `Bazro_Backup_${new Date().toLocaleDateString()}.json`;
    a.click();
}
</script>
</body>
</html>
