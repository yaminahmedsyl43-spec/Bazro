<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazro POS</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:linear-gradient(135deg,#1f1c2c,#928dab);
}
header{
  background:linear-gradient(135deg,#ff2a2a,#ff6a00);
  padding:16px;
  text-align:center;
}
header img{height:50px}
.container{max-width:520px;margin:auto;padding:15px}
.card{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}
input,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ddd;
}
button{
  border:none;
  background:linear-gradient(135deg,#ff2a2a,#ff6a00);
  color:white;
  font-weight:700;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:6px 0;
}
.qty{display:flex;gap:6px;align-items:center}
.qty button{width:36px;padding:6px}
.total{text-align:right;font-size:18px;font-weight:800;margin-top:10px}
#reader{margin-top:10px}
</style>
</head>

<body>

<header>
  <img src="bazro-logo.png" alt="Bazro">
</header>

<div class="container">

<!-- ADD PRODUCT -->
<div class="card">
<h3>Add / Update Product</h3>
<div id="reader"></div>
<button onclick="startScanner('add')">📷 Scan Barcode</button>
<input id="barcode" placeholder="Barcode">
<input id="name" placeholder="Product name">
<input id="price" type="number" step="0.01" placeholder="Price">
<input id="stock" type="number" placeholder="Stock (optional)">
<button onclick="addProduct()">Save Product</button>
</div>

<!-- SELL -->
<div class="card">
<h3>Sell Products</h3>
<button onclick="startScanner('sell')">📷 Scan to Sell</button>
<input id="sellBarcode" placeholder="Manual barcode">
<button onclick="addToCart()">Add</button>

<div id="cart"></div>
<div class="total" id="total">Total: £0.00</div>

<button onclick="checkout()">Checkout</button>
<button onclick="downloadLastReceipt()">📥 Download Receipt</button>
<button onclick="downloadDaily()">📦 Download Today Sales</button>
</div>

</div>

<script>
/* ===== STORAGE ===== */
let products = JSON.parse(localStorage.getItem("products") || "{}");
let sales = JSON.parse(localStorage.getItem("sales") || "[]");
let cart = [];

/* ===== SCANNER (SAFE SINGLE INSTANCE) ===== */
const html5QrCode = new Html5Qrcode("reader");
let scanning = false;
let scanMode = "sell";

function startScanner(mode){
  scanMode = mode;
  if(scanning){
    html5QrCode.stop().catch(()=>{});
    scanning = false;
  }
  html5QrCode.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },
    code=>{
      if(scanMode==="add"){
        barcode.value = code;
      }else{
        addToCart(code);
      }
      html5QrCode.stop().then(()=>scanning=false);
    }
  ).then(()=>scanning=true)
   .catch(()=>alert("Camera needs HTTPS or localhost"));
}

/* ===== PRODUCTS ===== */
function addProduct(){
  const b = barcode.value.trim();
  const n = name.value.trim();
  const p = price.value.trim();
  const s = stock.value.trim() || "0";

  if(b==="" || n==="" || p===""){
    alert("Barcode, name and price required");
    return;
  }

  products[b] = {
    name: n,
    price: Number(p),
    stock: Number(s)
  };

  localStorage.setItem("products", JSON.stringify(products));

  barcode.value="";
  name.value="";
  price.value="";
  stock.value="";

  alert("Product saved");
}

/* ===== CART ===== */
function addToCart(code=null){
  const b = (code || sellBarcode.value).trim();
  const p = products[b];

  if(!p){ alert("Product not found"); return; }
  if(p.stock<=0){ alert("Out of stock"); return; }

  let item = cart.find(i=>i.barcode===b);
  if(item){ item.qty++; }
  else{ cart.push({barcode:b,name:p.name,price:p.price,qty:1}); }

  p.stock--;
  localStorage.setItem("products", JSON.stringify(products));
  sellBarcode.value="";
  renderCart();
}

function changeQty(b,d){
  let i = cart.find(x=>x.barcode===b);
  if(!i) return;
  if(d>0 && products[b].stock<=0) return;

  i.qty+=d;
  products[b].stock-=d;
  if(i.qty<=0) cart=cart.filter(x=>x.barcode!==b);

  localStorage.setItem("products", JSON.stringify(products));
  renderCart();
}

function renderCart(){
  let total=0;
  const cartDiv = document.getElementById("cart");

  cartDiv.innerHTML = cart.map(i=>{
    let l=i.price*i.qty; total+=l;
    return `
      <div class="cart-item">
        <span><strong>${i.name}</strong><br>£${i.price.toFixed(2)}</span>
        <div class="qty">
          <button onclick="changeQty('${i.barcode}',-1)">−</button>
          <strong>${i.qty}</strong>
          <button onclick="changeQty('${i.barcode}',1)">+</button>
        </div>
        <strong>£${l.toFixed(2)}</strong>
      </div>`;
  }).join("");

  document.getElementById("total").innerText=`Total: £${total.toFixed(2)}`;
}

/* ===== CHECKOUT ===== */
function checkout(){
  if(!cart.length){ alert("Cart empty"); return; }

  sales.push({
    date:new Date().toLocaleString(),
    items:JSON.parse(JSON.stringify(cart))
  });

  localStorage.setItem("sales",JSON.stringify(sales));
  cart=[];
  renderCart();
  alert("Sale saved");
}

/* ===== RECEIPTS ===== */
function downloadLastReceipt(){
  if(!sales.length) return;
  const s=sales[sales.length-1];
  let total=0;
  let text=`BAZRO RECEIPT\n${s.date}\n----------------\n`;
  s.items.forEach(i=>{
    let l=i.price*i.qty; total+=l;
    text+=`${i.qty}x ${i.name} £${l.toFixed(2)}\n`;
  });
  text+=`----------------\nTOTAL £${total.toFixed(2)}`;
  download(text,`receipt_${Date.now()}.txt`);
}

function downloadDaily(){
  let today=new Date().toLocaleDateString();
  let text=`BAZRO DAILY SALES ${today}\n================\n`;
  let grand=0;

  sales.filter(s=>s.date.includes(today)).forEach((s,n)=>{
    let total=0;
    text+=`\nSale ${n+1} - ${s.date}\n`;
    s.items.forEach(i=>{
      let l=i.price*i.qty; total+=l;
      text+=`${i.qty}x ${i.name} £${l.toFixed(2)}\n`;
    });
    text+=`Subtotal £${total.toFixed(2)}\n`;
    grand+=total;
  });

  text+=`\nGRAND TOTAL £${grand.toFixed(2)}`;
  download(text,`daily_${today.replace(/\//g,'-')}.txt`);
}

function download(text,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));
  a.download=name;
  a.click();
}
</script>

</body>
</html>
