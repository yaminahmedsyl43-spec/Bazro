<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#141e30,#243b55);
  color:#222;
}
header{
  background:linear-gradient(135deg,#ff512f,#f09819);
  padding:16px;
  text-align:center;
  color:white;
  font-size:22px;
  font-weight:800;
}
.container{max-width:520px;margin:auto;padding:15px}
.card{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}
input,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  border:none;
  background:linear-gradient(135deg,#ff512f,#f09819);
  color:white;
  font-weight:700;
  cursor:pointer;
}
button.secondary{
  background:#444;
}
#reader{margin-top:10px}
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0;
}
.qty{display:flex;gap:6px;align-items:center}
.qty button{
  width:32px;
  padding:6px;
  background:#eee;
  color:#222;
  font-weight:800;
}
.total{
  text-align:right;
  font-size:18px;
  font-weight:800;
  margin-top:10px;
}
</style>
</head>

<body>

<header>BAZRO POS</header>

<div class="container">

<!-- ADD PRODUCT -->
<div class="card">
<h3>Add Product</h3>
<div id="reader"></div>
<button onclick="startScan('add')">📷 Scan Barcode</button>

<input id="p_barcode" placeholder="Barcode">
<input id="p_name" placeholder="Product name">
<input id="p_price" type="number" step="0.01" placeholder="Price">
<input id="p_stock" type="number" placeholder="Stock (optional)">

<button onclick="addProduct()">Save Product</button>
</div>

<!-- SELL -->
<div class="card">
<h3>Sell</h3>
<button onclick="startScan('sell')">📷 Scan to Sell</button>

<input id="sell_barcode" placeholder="Manual barcode">
<button onclick="addToCart()">Add to Cart</button>

<div id="cart"></div>
<div class="total" id="total">Total: £0.00</div>

<button onclick="checkout()">Checkout</button>
<button class="secondary" onclick="downloadLast()">Download Receipt</button>
<button class="secondary" onclick="downloadDaily()">Download Today</button>
</div>

</div>

<script>
/* ===== DATA ===== */
let products = JSON.parse(localStorage.getItem("products") || "{}");
let sales = JSON.parse(localStorage.getItem("sales") || "[]");
let cart = [];

/* ===== SCANNER ===== */
const qr = new Html5Qrcode("reader");
let scanMode = "";

function startScan(mode){
  scanMode = mode;
  qr.stop().catch(()=>{});
  qr.start(
    {facingMode:"environment"},
    {fps:10,qrbox:250},
    code=>{
      if(scanMode==="add"){
        document.getElementById("p_barcode").value = code;
      }else{
        addToCart(code);
      }
      qr.stop().catch(()=>{});
    }
  ).catch(()=>alert("Use HTTPS or localhost"));
}

/* ===== ADD PRODUCT (BULLETPROOF) ===== */
function addProduct(){
  const b = document.getElementById("p_barcode").value.trim();
  const n = document.getElementById("p_name").value.trim();
  const p = document.getElementById("p_price").value;
  const s = document.getElementById("p_stock").value || 0;

  if(b === "" || n === "" || p === ""){
    alert("Barcode, name and price are required");
    return;
  }

  products[b] = {
    name: n,
    price: Number(p),
    stock: Number(s)
  };

  localStorage.setItem("products", JSON.stringify(products));

  document.getElementById("p_barcode").value="";
  document.getElementById("p_name").value="";
  document.getElementById("p_price").value="";
  document.getElementById("p_stock").value="";

  alert("Product saved successfully");
}

/* ===== CART ===== */
function addToCart(code=null){
  const b = (code || document.getElementById("sell_barcode").value).trim();
  if(b==="") return;

  const prod = products[b];
  if(!prod){ alert("Product not found"); return; }
  if(prod.stock <= 0){ alert("Out of stock"); return; }

  let item = cart.find(i=>i.barcode===b);
  if(item){ item.qty++; }
  else{
    cart.push({barcode:b,name:prod.name,price:prod.price,qty:1});
  }

  prod.stock--;
  localStorage.setItem("products", JSON.stringify(products));
  document.getElementById("sell_barcode").value="";
  renderCart();
}

function changeQty(b,d){
  let item = cart.find(i=>i.barcode===b);
  if(!item) return;

  if(d>0 && products[b].stock<=0) return;

  item.qty += d;
  products[b].stock -= d;

  if(item.qty<=0){
    cart = cart.filter(i=>i.barcode!==b);
  }

  localStorage.setItem("products", JSON.stringify(products));
  renderCart();
}

function renderCart(){
  let total = 0;
  const div = document.getElementById("cart");

  div.innerHTML = cart.map(i=>{
    const line = i.qty * i.price;
    total += line;
    return `
      <div class="cart-item">
        <span><strong>${i.name}</strong><br>£${i.price.toFixed(2)}</span>
        <div class="qty">
          <button onclick="changeQty('${i.barcode}',-1)">−</button>
          <strong>${i.qty}</strong>
          <button onclick="changeQty('${i.barcode}',1)">+</button>
        </div>
        <strong>£${line.toFixed(2)}</strong>
      </div>
    `;
  }).join("");

  document.getElementById("total").innerText = `Total: £${total.toFixed(2)}`;
}

/* ===== CHECKOUT & RECEIPTS ===== */
function checkout(){
  if(cart.length===0){ alert("Cart empty"); return; }

  sales.push({
    date:new Date().toLocaleString(),
    items:JSON.parse(JSON.stringify(cart))
  });

  localStorage.setItem("sales", JSON.stringify(sales));
  cart=[];
  renderCart();
  alert("Sale completed");
}

function downloadLast(){
  if(!sales.length) return;
  downloadReceipt(sales[sales.length-1],"receipt");
}

function downloadDaily(){
  let today = new Date().toLocaleDateString();
  let text = `BAZRO DAILY SALES ${today}\n\n`;
  let grand = 0;

  sales.filter(s=>s.date.includes(today)).forEach((s,i)=>{
    let t=0;
    text += `Sale ${i+1} - ${s.date}\n`;
    s.items.forEach(it=>{
      let l=it.qty*it.price;
      t+=l;
      text+=`${it.qty}x ${it.name} £${l.toFixed(2)}\n`;
    });
    text+=`Subtotal £${t.toFixed(2)}\n\n`;
    grand+=t;
  });

  text+=`GRAND TOTAL £${grand.toFixed(2)}`;
  download(text,"daily_sales");
}

function downloadReceipt(s,name){
  let t=0;
  let text=`BAZRO RECEIPT\n${s.date}\n----------------\n`;
  s.items.forEach(i=>{
    let l=i.qty*i.price; t+=l;
    text+=`${i.qty}x ${i.name} £${l.toFixed(2)}\n`;
  });
  text+=`----------------\nTOTAL £${t.toFixed(2)}`;
  download(text,name);
}

function download(text,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));
  a.download=`${name}_${Date.now()}.txt`;
  a.click();
}
</script>

</body>
</html>
