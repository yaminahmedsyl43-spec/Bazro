<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS - Ultra Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    :root { --orange: #ff512f; --yellow: #f09819; --dark: #141e30; --green: #27ae60; --red: #e74c3c; --gold: #D4AF37; --slate: #243b55; }
    
    body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; padding-bottom: 100px; color: #333; overflow-x: hidden; }
    
    header { background: linear-gradient(135deg, var(--dark), var(--slate)); padding: 20px; text-align: center; color: white; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    header h1 { margin: 0; font-size: 28px; letter-spacing: 4px; font-weight: 900; color: var(--gold); }
    header p { margin: 5px 0 0; font-size: 10px; opacity: 0.8; letter-spacing: 1px; }

    .container { max-width: 500px; margin: auto; padding: 15px; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .active-page { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); }
    h3 { margin-top: 0; color: var(--dark); font-size: 18px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 15px; }
    
    .input-row { display: flex; gap: 10px; }
    input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; background: #fdfdfd; }
    button { width: 100%; padding: 16px; margin: 8px 0; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--orange), var(--yellow)); color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.97); }
    
    .btn-sec { background: var(--slate); }
    .btn-pdf { background: #1a1a1a; border: 1px solid var(--gold); color: var(--gold); }
    .btn-qr { background: var(--gold); color: #000; }
    .btn-share { background: #25D366; color: white; }

    #scanner-wrap { background: #000; border-radius: 20px; display: none; margin-bottom: 20px; padding: 10px; position: relative; }
    #reader { width: 100%; border-radius: 15px; overflow: hidden; }
    #flash-btn { position: absolute; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; z-index: 10; display: none; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); font-size: 24px; color: white; border: none; }

    .row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f1f1f1; align-items: center; }
    .qty-ctrl { display: flex; align-items: center; gap: 15px; background: #f1f3f5; padding: 5px 12px; border-radius: 30px; }
    .q-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--dark); color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; border: none; }
    
    .stock-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .stock-table th { text-align: left; padding: 10px; color: #888; border-bottom: 1px solid #eee; }
    .stock-table td { padding: 12px 10px; border-bottom: 1px solid #f9f9f9; }

    nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; height: 80px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 1000; }
    nav button { flex: 1; background: none; color: #adb5bd; border-top: 4px solid transparent; border-radius: 0; margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    nav button.active-nav { color: var(--orange); border-top-color: var(--orange); }

    /* Hidden Template for EOD JPEG */
    #eod-template { 
        width: 350px; background: white; padding: 40px 20px; border: 1px solid #eee; 
        position: fixed; left: -9999px; top: 0; color: #333; text-align: center;
    }

    #status-msg { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); padding: 12px 35px; border-radius: 50px; color: white; font-weight: 600; z-index: 9999; opacity: 0; transition: 0.4s; pointer-events: none; }
</style>
</head>
<body>

<div id="status-msg"></div>

<header>
    <h1>BAZRO</h1>
    <p>9a Commercial St, Camborne TR14 8AT • 07534 100986</p>
</header>

<div id="eod-template">
    <div style="background: #141e30; color: #D4AF37; padding: 20px; margin-bottom: 20px; border-radius: 10px;">
        <h1 style="margin:0; letter-spacing:4px;">BAZRO</h1>
        <p style="margin:5px 0 0; color:white; font-size:10px;">END OF DAY SUMMARY</p>
    </div>
    <p id="tmp-date" style="font-weight: bold;"></p>
    <hr>
    <div style="text-align: left; padding: 10px 20px;">
        <p>CASH SALES: <span id="tmp-cash" style="float:right"></span></p>
        <p>CARD SALES: <span id="tmp-card" style="float:right"></span></p>
        <p>EXPENSES: <span id="tmp-exp" style="float:right"></span></p>
        <p style="color: #666;">TILL LEFT: <span id="tmp-till" style="float:right"></span></p>
        <div style="border-top: 2px solid #000; margin-top: 10px; padding-top: 10px; font-size: 24px; font-weight: 900;">
            TOTAL: <span id="tmp-net" style="float:right"></span>
        </div>
    </div>
    <p style="margin-top: 40px; font-style: italic; color: #888;">System Generated • Net = Cash + Card</p>
</div>

<div class="container">
    <div id="scanner-wrap">
        <div id="reader"></div>
        <button id="flash-btn" onclick="toggleFlash()">🔦</button>
        <button class="btn-stop" onclick="stopScan()" style="margin-top:10px">CLOSE CAMERA</button>
    </div>

    <div id="page-sales" class="page active-page">
        <div class="card">
            <h3>Checkout</h3>
            <button onclick="startScan('sell')">📷 SCAN ITEM</button>
            <input id="sell_barcode" placeholder="Barcode Entry">
            <button class="btn-sec" onclick="addToCart()">ADD MANUALLY</button>
        </div>
        <div class="card">
            <h3>Basket</h3>
            <div id="cart-list"></div>
            <div style="text-align:right; font-weight:800; font-size:26px; margin:20px 0;" id="cart-total">Total: £0.00</div>
            <button style="background:var(--green)" onclick="checkout()">COMPLETE SALE</button>
            <button class="btn-qr" onclick="generateQR(null)">📱 QR SCAN</button>
            <button class="btn-pdf" onclick="downloadInvoice(null)">📄 PDF INVOICE</button>
        </div>
    </div>

    <div id="page-history" class="page">
        <div class="card">
            <h3>Sales History</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <div id="page-stock" class="page">
        <div class="card">
            <h3>Stock Entry</h3>
            <button onclick="startScan('add')">📷 SCAN BARCODE</button>
            <input id="p_barcode" placeholder="Barcode ID">
            <input id="p_name" placeholder="Name">
            <input id="p_price" type="number" step="0.01" placeholder="Price £">
            <input id="p_stock" type="number" placeholder="Qty Available">
            <button onclick="addProduct()">SAVE PRODUCT</button>
        </div>
        <div class="card">
            <h3>Quantity Available</h3>
            <table class="stock-table">
                <thead><tr><th>Item</th><th>Price</th><th>Stock</th></tr></thead>
                <tbody id="stock-inventory-list"></tbody>
            </table>
        </div>
    </div>

    <div id="page-report" class="page">
        <div class="card">
            <h3>End of Day Report</h3>
            <input type="date" id="report_date">
            <input type="number" id="cash_sales" placeholder="Cash Sales (£)">
            <input type="number" id="card_sales" placeholder="Card Sales (£)">
            <div class="input-row">
                <input type="number" id="expenses" placeholder="Expenses (£)">
                <input type="number" id="till_left" placeholder="Till Left (£)">
            </div>
            <button class="btn-share" onclick="shareEODReport()">📤 SHARE SUMMARY (JPEG)</button>
        </div>
    </div>
</div>

<nav>
    <button id="nav-sales" class="active-nav" onclick="showPage('sales')">SHOP</button>
    <button id="nav-history" onclick="showPage('history')">HISTORY</button>
    <button id="nav-stock" onclick="showPage('stock')">STOCK</button>
    <button id="nav-report" onclick="showPage('report')">REPORT</button>
</nav>

<script>
let products = JSON.parse(localStorage.getItem("bazro_products") || "{}");
let sales = JSON.parse(localStorage.getItem("bazro_sales") || "[]");
let cart = [];
let html5QrCode = null;
let scanPaused = false;
let isFlashOn = false;

const INFO = { name: "BAZRO", address: "9a Commercial St, Camborne TR14 8AT", phone: "07534 100986" };

function showPage(p) {
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
    document.getElementById('page-'+p).classList.add('active-page');
    document.getElementById('nav-'+p).classList.add('active-nav');
    if(p === 'history') renderHistory();
    if(p === 'stock') renderStockList();
    stopScan();
}

function notify(msg, color) {
    const el = document.getElementById("status-msg");
    el.innerText = msg; el.style.background = color; el.style.opacity = "1";
    setTimeout(() => el.style.opacity = "0", 2500);
}

// --- SCANNER ---
async function startScan(mode) {
    if (html5QrCode) { try { await html5QrCode.stop(); } catch(e) {} }
    document.getElementById("reader").innerHTML = "";
    document.getElementById("scanner-wrap").style.display = "block";
    html5QrCode = new Html5Qrcode("reader");

    try {
        await html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (code) => {
            if (scanPaused) return;
            if (mode === 'add') {
                document.getElementById("p_barcode").value = code;
                stopScan(); notify("Barcode Captured", "var(--green)");
            } else {
                if (!products[code]) { notify("Unknown Item", "red"); return; }
                scanPaused = true;
                addToCart(code);
                notify(products[code].name + " Added", "var(--green)");
                setTimeout(() => { scanPaused = false; }, 2000); // 2S DELAY
            }
        });
        setTimeout(() => {
            const track = html5QrCode.getRunningTrackCapabilities();
            if(track.torch) document.getElementById("flash-btn").style.display = "block";
        }, 1000);
    } catch (err) { notify("Camera Error", "red"); }
}

async function stopScan() {
    if (html5QrCode) { await html5QrCode.stop(); html5QrCode.clear(); }
    document.getElementById("scanner-wrap").style.display = "none";
}

async function toggleFlash() {
    isFlashOn = !isFlashOn;
    await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isFlashOn }] });
}

// --- SHOP ---
function addToCart(manualCode = null) {
    const b = (manualCode || document.getElementById("sell_barcode").value).trim();
    if (!products[b]) return notify("Unknown Barcode", "red");
    let item = cart.find(i => i.barcode === b);
    if (item) item.qty++;
    else cart.push({ barcode: b, name: products[b].name, price: products[b].price, qty: 1 });
    renderCart();
    document.getElementById("sell_barcode").value = "";
}

function updateQty(barcode, change) {
    let item = cart.find(i => i.barcode === barcode);
    if (!item) return;
    item.qty += change;
    if (item.qty <= 0) cart = cart.filter(i => i.barcode !== barcode);
    renderCart();
}

function renderCart() {
    let t = 0;
    document.getElementById("cart-list").innerHTML = cart.map(i => {
        t += i.qty * i.price;
        return `<div class="row">
            <div style="flex:1"><b>${i.name}</b><br><small>£${i.price.toFixed(2)}</small></div>
            <div class="qty-ctrl"><button class="q-btn" onclick="updateQty('${i.barcode}',-1)">-</button><span>${i.qty}</span><button class="q-btn" onclick="updateQty('${i.barcode}',1)">+</button></div>
            <div style="width:70px; text-align:right; font-weight:bold;">£${(i.qty*i.price).toFixed(2)}</div>
        </div>`;
    }).join("");
    document.getElementById("cart-total").innerText = `Total: £${t.toFixed(2)}`;
}

function checkout() {
    if(!cart.length) return;
    cart.forEach(item => { if(products[item.barcode]) products[item.barcode].stock -= item.qty; });
    localStorage.setItem("bazro_products", JSON.stringify(products));
    sales.unshift({ time: new Date().toLocaleString(), items: [...cart] });
    localStorage.setItem("bazro_sales", JSON.stringify(sales));
    notify("Transaction Complete", "var(--green)");
    cart = []; renderCart();
}

// --- EOD JPEG SHARE ---
async function shareEODReport() {
    const date = document.getElementById("report_date").value;
    const cash = parseFloat(document.getElementById("cash_sales").value || 0);
    const card = parseFloat(document.getElementById("card_sales").value || 0);
    const exp = parseFloat(document.getElementById("expenses").value || 0);
    const till = document.getElementById("till_left").value || "0";
    
    if(!date) return notify("Select a Date", "red");
    
    // NET TOTAL = CASH + CARD (Expenses and Till Left are reference only)
    const net = cash + card;

    // Update hidden template
    document.getElementById("tmp-date").innerText = `Date: ${date}`;
    document.getElementById("tmp-cash").innerText = `£${cash.toFixed(2)}`;
    document.getElementById("tmp-card").innerText = `£${card.toFixed(2)}`;
    document.getElementById("tmp-exp").innerText = `£${exp.toFixed(2)}`;
    document.getElementById("tmp-till").innerText = `£${till}`;
    document.getElementById("tmp-net").innerText = `£${net.toFixed(2)}`;

    const template = document.getElementById("eod-template");
    
    const canvas = await html2canvas(template);
    canvas.toBlob(async (blob) => {
        const file = new File([blob], `Bazro_EOD_${date}.jpg`, { type: 'image/jpeg' });
        
        if (navigator.share) {
            try {
                await navigator.share({
                    files: [file],
                    title: `Bazro EOD Summary ${date}`,
                    text: `EOD Net Total: £${net.toFixed(2)}`
                });
            } catch (err) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `Bazro_EOD_${date}.jpg`;
                a.click();
            }
        } else {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `Bazro_EOD_${date}.jpg`;
            a.click();
        }
    }, 'image/jpeg', 0.9);
}

// --- PDF & QR ---
function buildPDF(idx) {
    const items = (idx === null) ? cart : sales[idx].items;
    if(!items.length) return null;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', [80, 150]);
    doc.setFillColor(20, 30, 53); doc.rect(0, 0, 80, 25, 'F');
    doc.setTextColor(212, 175, 55); doc.setFontSize(20); doc.text(INFO.name, 40, 12, {align:'center'});
    doc.setTextColor(255, 255, 255); doc.setFontSize(6); doc.text(INFO.address, 40, 17, {align:'center'});
    doc.text(INFO.phone, 40, 21, {align:'center'});
    doc.setTextColor(0,0,0); doc.setFontSize(9);
    let y = 35; let total = 0;
    items.forEach(i => {
        let sub = i.qty * i.price; total += sub;
        doc.text(`${i.name.substring(0,18)} x${i.qty}`, 10, y);
        doc.text(`£${sub.toFixed(2)}`, 70, y, {align:'right'}); y += 6;
    });
    doc.line(10, y+2, 70, y+2);
    doc.setFontSize(14); doc.text("TOTAL:", 10, y+10); doc.text(`£${total.toFixed(2)}`, 70, y+10, {align:'right'});
    return doc;
}
function downloadInvoice(idx) { const doc = buildPDF(idx); if(doc) doc.save(`Bazro_Inv.pdf`); }
function generateQR(idx) {
    const doc = buildPDF(idx); if(!doc) return;
    const base64 = doc.output('datauristring');
    document.getElementById("qr-box").innerHTML = "";
    new QRCode(document.getElementById("qr-box"), { text: base64, width: 200, height: 200 });
}

// --- STOCK & HISTORY ---
function renderHistory() {
    document.getElementById("history-list").innerHTML = sales.map((s, idx) => `
        <div class="card" style="padding:15px; border-left: 4px solid var(--gold)">
            <div style="font-size:13px"><b>${s.time}</b></div>
            <div style="display:flex; gap:10px; margin-top:10px">
                <button class="btn-pdf" style="padding:8px; font-size:11px" onclick="downloadInvoice(${idx})">PDF</button>
            </div>
        </div>`).join("");
}
function addProduct() {
    const b = document.getElementById("p_barcode").value, n = document.getElementById("p_name").value, p = document.getElementById("p_price").value, s = document.getElementById("p_stock").value;
    if(!b || !n || !p) return notify("Missing info", "red");
    products[b] = { name: n, price: Number(p), stock: Number(s || 0) };
    localStorage.setItem("bazro_products", JSON.stringify(products));
    notify(n + " Saved", "var(--green)"); renderStockList();
}
function renderStockList() {
    document.getElementById("stock-inventory-list").innerHTML = Object.entries(products).map(([c, p]) => `
        <tr><td>${p.name}</td><td>£${p.price.toFixed(2)}</td><td style="color:${p.stock<5?'red':'black'}">${p.stock}</td></tr>
    `).join("");
}
window.onload = () => { renderStockList(); };
</script>
</body>
</html>
