<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bazro POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#f4f6f9; padding-bottom:90px;}
header { background:#111; color:#fff; padding:15px; text-align:center; font-size:22px; font-weight:bold;}
.container{ max-width:500px; margin:auto; padding:15px;}
.card{ background:#fff; padding:15px; margin-bottom:15px; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,0.05);}
button{ width:100%; padding:12px; margin:6px 0; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
.primary{ background:#ff512f; color:#fff;}
.sec{ background:#333; color:#fff;}
.green{ background:#27ae60; color:#fff;}
.red{ background:#e74c3c; color:#fff;}
#reader{ width:100%;}
nav{ position:fixed; bottom:0; width:100%; display:flex; background:#fff; border-top:1px solid #ddd;}
nav button{ flex:1; background:none; padding:10px; font-size:12px;}
.active{ background:#ff512f; color:#fff;}
</style>
</head>

<body>

<header>BAZRO</header>

<div class="container">

<!-- SALES PAGE -->
<div id="salesPage" class="page">
<div class="card">
<button class="primary" onclick="startScan()">SCAN PRODUCT</button>
<div id="reader" style="display:none;"></div>
<button id="flashBtn" class="sec" style="display:none;" onclick="toggleFlash()">FLASH OFF</button>
<input id="barcodeInput" placeholder="Enter Barcode">
<button class="sec" onclick="addToCart()">ADD TO CART</button>
</div>

<div class="card">
<h3>Basket</h3>
<div id="cartList"></div>
<h2 id="total">Total: £0.00</h2>
<button class="green" onclick="checkout()">COMPLETE SALE</button>
<button class="sec" onclick="downloadReceipt()">Download Bazro Receipt (Optional)</button>
</div>
</div>

<!-- STOCK PAGE -->
<div id="stockPage" class="page" style="display:none;">
<div class="card">
<h3>Add Product</h3>
<input id="pBarcode" placeholder="Barcode">
<input id="pName" placeholder="Product Name">
<input id="pPrice" type="number" placeholder="Price">
<input id="pQty" type="number" placeholder="Stock Qty">
<button class="primary" onclick="saveProduct()">Save Product</button>
</div>
</div>

<!-- HISTORY PAGE -->
<div id="historyPage" class="page" style="display:none;">
<div class="card">
<h3>Sales History</h3>
<div id="historyList"></div>
<button class="red" onclick="clearHistory()">Clear History</button>
</div>
</div>

</div>

<nav>
<button class="active" onclick="showPage('salesPage',this)">SHOP</button>
<button onclick="showPage('stockPage',this)">STOCK</button>
<button onclick="showPage('historyPage',this)">HISTORY</button>
</nav>

<script>

const INFO = {
    name:"BAZRO",
    address:"9a Commercial St, Camborne TR14 8AT",
    phone:"07534 100986"
};

let products = JSON.parse(localStorage.getItem("products")||"{}");
let sales = JSON.parse(localStorage.getItem("sales")||"[]");
let cart = [];
let html5QrCode;
let flashOn=false;

function showPage(id,btn){
    document.querySelectorAll('.page').forEach(p=>p.style.display="none");
    document.getElementById(id).style.display="block";
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    if(id==="historyPage") renderHistory();
}

function saveProduct(){
    const code=pBarcode.value;
    products[code]={
        name:pName.value,
        price:parseFloat(pPrice.value),
        qty:parseInt(pQty.value)
    };
    localStorage.setItem("products",JSON.stringify(products));
    alert("Saved");
}

function addToCart(){
    const code=barcodeInput.value;
    if(!products[code]) return alert("Product not found");
    cart.push({code,name:products[code].name,price:products[code].price});
    renderCart();
}

function renderCart(){
    let total=0;
    cartList.innerHTML="";
    cart.forEach((item,i)=>{
        total+=item.price;
        cartList.innerHTML+=`<div>${item.name} - £${item.price.toFixed(2)}</div>`;
    });
    totalEl = document.getElementById("total");
    totalEl.innerText="Total: £"+total.toFixed(2);
}

function checkout(){
    if(!cart.length) return alert("Cart empty");
    sales.push({date:new Date().toLocaleString(),items:cart});
    localStorage.setItem("sales",JSON.stringify(sales));
    cart=[];
    renderCart();
    alert("Sale Completed");
}

function renderHistory(){
    historyList.innerHTML="";
    sales.forEach(s=>{
        historyList.innerHTML+=`<div><b>${s.date}</b> - ${s.items.length} items</div>`;
    });
}

function clearHistory(){
    sales=[];
    localStorage.setItem("sales","[]");
    renderHistory();
}

async function startScan(){
    document.getElementById("reader").style.display="block";
    document.getElementById("flashBtn").style.display="block";
    html5QrCode=new Html5Qrcode("reader");
    await html5QrCode.start({facingMode:"environment"},
    {fps:10,qrbox:250},
    code=>{
        barcodeInput.value=code;
        html5QrCode.stop();
        reader.style.display="none";
        flashBtn.style.display="none";
    });
}

async function toggleFlash(){
    if(!html5QrCode) return;
    flashOn=!flashOn;
    await html5QrCode.applyVideoConstraints({advanced:[{torch:flashOn}]});
    flashBtn.innerText=flashOn?"FLASH ON":"FLASH OFF";
}

async function downloadReceipt(){
    if(!cart.length) return alert("No items");
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(22);
    doc.text(INFO.name,105,20,{align:"center"});

    doc.setFontSize(10);
    doc.text(INFO.address,105,28,{align:"center"});
    doc.text("Phone: "+INFO.phone,105,34,{align:"center"});

    let y=50;
    let total=0;

    cart.forEach(item=>{
        doc.text(item.name,20,y);
        doc.text("£"+item.price.toFixed(2),170,y);
        total+=item.price;
        y+=8;
    });

    y+=10;
    doc.line(20,y,190,y);
    y+=8;
    doc.setFontSize(14);
    doc.text("TOTAL: £"+total.toFixed(2),190,y,{align:"right"});

    doc.save("Bazro_Receipt.pdf");
}

</script>
</body>
</html>
